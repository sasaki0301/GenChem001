<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Balancing and Writing Chemical Reactions</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Balancing and Writing Chemical Reactions - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"What is the primary purpose of a chemical equation?",c:["To identify atomic masses","To represent a chemical reaction symbolically","To determine molar mass","To classify compounds"],a:1,e:"Chemical equations use symbols and formulas to represent chemical reactions."},

{q:"In a chemical reaction, the substances present before the reaction begins are called:",c:["Products","Catalysts","Reactants","Compounds"],a:2,e:"Reactants are the starting substances in a chemical reaction."},

{q:"The substances formed after a reaction are called:",c:["Reactants","Products","Catalysts","Elements"],a:1,e:"Products are the substances formed during a chemical reaction."},

{q:"What does the arrow (→) in a chemical equation mean?",c:["Combines with","Separates into","Produces or yields","Balances"],a:2,e:"The arrow indicates that reactants produce products."},

{q:"Which law explains why chemical equations must be balanced?",c:["Law of Definite Proportions","Law of Multiple Proportions","Law of Conservation of Mass","Law of Conservation of Energy"],a:2,e:"Atoms cannot be created or destroyed during a chemical reaction."},

{q:"When balancing chemical equations, which may be changed?",c:["Subscripts","Chemical formulas","Coefficients","Element symbols"],a:2,e:"Only coefficients may be changed when balancing equations."},

{q:"Why should subscripts never be changed when balancing equations?",c:["They determine reaction speed","They identify the substance itself","They represent coefficients","They affect atomic masses"],a:1,e:"Changing a subscript changes the identity of the compound."},

{q:"Which equation is correctly balanced?",c:["H₂ + O₂ → H₂O","2H₂ + O₂ → 2H₂O","H₂ + 2O₂ → H₂O","2H₂ + 2O₂ → 2H₂O"],a:1,e:"The balanced equation contains equal numbers of hydrogen and oxygen atoms on both sides."},

{q:"How many oxygen atoms are present in 3O₂?",c:["2","3","5","6"],a:3,e:"3 molecules of O₂ contain 3 × 2 = 6 oxygen atoms."},

{q:"Which statement about coefficients is TRUE?",c:["They change the compound's identity","They indicate the number of molecules or moles","They cannot be changed","They represent atomic mass"],a:1,e:"Coefficients indicate the quantity of molecules or moles."},

{q:"Balance the equation: Mg + O₂ → MgO",c:["Mg + O₂ → MgO","2Mg + O₂ → 2MgO","Mg + 2O₂ → MgO","2Mg + 2O₂ → Mg₂O"],a:1,e:"Two magnesium atoms react with one oxygen molecule to produce two magnesium oxide units."},

{q:"Balance the equation: N₂ + H₂ → NH₃",c:["N₂ + H₂ → NH₃","N₂ + 2H₂ → 2NH₃","N₂ + 3H₂ → 2NH₃","2N₂ + H₂ → 2NH₃"],a:2,e:"The balanced equation is N₂ + 3H₂ → 2NH₃."},

{q:"Balance the equation: Fe + O₂ → Fe₂O₃",c:["2Fe + O₂ → Fe₂O₃","4Fe + 3O₂ → 2Fe₂O₃","2Fe + 3O₂ → Fe₂O₃","4Fe + O₂ → 2Fe₂O₃"],a:1,e:"This equation requires balancing both iron and oxygen atoms."},

{q:"What is the coefficient of oxygen in the balanced equation 4Fe + 3O₂ → 2Fe₂O₃?",c:["1","2","3","4"],a:2,e:"The coefficient in front of O₂ is 3."},

{q:"Balance the equation: Al + O₂ → Al₂O₃",c:["2Al + O₂ → Al₂O₃","4Al + 3O₂ → 2Al₂O₃","Al + O₂ → Al₂O₃","2Al + 3O₂ → Al₂O₃"],a:1,e:"The balanced equation is 4Al + 3O₂ → 2Al₂O₃."},

{q:"When a polyatomic ion remains unchanged on both sides of an equation, it is often best to:",c:["Break it apart completely","Treat it as a single unit","Ignore it","Convert it to elements"],a:1,e:"Treating unchanged polyatomic ions as units simplifies balancing."},

{q:"Balance the equation: Fe₂(SO₄)₃ + KOH → Fe(OH)₃ + K₂SO₄. What is the coefficient of KOH?",c:["2","3","4","6"],a:3,e:"The balanced equation is Fe₂(SO₄)₃ + 6KOH → 2Fe(OH)₃ + 3K₂SO₄."},

{q:"Balance the equation: Na₃PO₄ + MgCl₂ → Mg₃(PO₄)₂ + NaCl. What is the coefficient of MgCl₂?",c:["1","2","3","4"],a:2,e:"The balanced equation is 2Na₃PO₄ + 3MgCl₂ → Mg₃(PO₄)₂ + 6NaCl."},

{q:"Which statement best describes a balanced chemical equation?",c:["Equal masses of reactants and products only","Equal numbers of molecules on both sides","Equal numbers of atoms of each element on both sides","Equal coefficients on both sides"],a:2,e:"Balanced equations have equal numbers of each type of atom on both sides."},

{q:"Why is balancing chemical equations important for later stoichiometric calculations?",c:["It determines atomic numbers","It provides correct mole ratios","It identifies reaction types","It determines reaction speed"],a:1,e:"The coefficients in balanced equations become the mole ratios used in stoichiometry."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
