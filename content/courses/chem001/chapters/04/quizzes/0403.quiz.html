<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calculating Amounts of Reactants and Products</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Calculating Amounts of Reactants and Products - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>
const quizData = [

{q:"What is stoichiometry?",c:["The study of reaction rates","The study of quantitative relationships in chemical reactions","The classification of compounds","The study of atomic structure"],a:1,e:"Stoichiometry deals with the amounts of reactants and products involved in chemical reactions."},

{q:"What provides the mole ratios used in stoichiometric calculations?",c:["Subscripts","Atomic masses","Balanced equation coefficients","Periodic table groups"],a:2,e:"Coefficients in a balanced equation represent mole relationships."},

{q:"Which step should always be completed before performing a stoichiometric calculation?",c:["Determine percent yield","Calculate molar mass","Balance the chemical equation","Identify reaction type"],a:2,e:"An unbalanced equation gives incorrect mole ratios."},

{q:"In the equation N₂ + 3H₂ → 2NH₃, what is the mole ratio between H₂ and NH₃?",c:["1:2","2:3","3:2","1:3"],a:2,e:"The coefficients indicate 3 mol H₂ react to produce 2 mol NH₃."},

{q:"Using N₂ + 3H₂ → 2NH₃, how many moles of NH₃ are produced from 4.0 mol N₂?",c:["2.0 mol","4.0 mol","6.0 mol","8.0 mol"],a:3,e:"4.0 mol N₂ × (2 mol NH₃ / 1 mol N₂) = 8.0 mol NH₃."},

{q:"Using N₂ + 3H₂ → 2NH₃, how many moles of H₂ are required for 2.0 mol N₂?",c:["2.0 mol","3.0 mol","4.0 mol","6.0 mol"],a:3,e:"2.0 mol N₂ × (3 mol H₂ / 1 mol N₂) = 6.0 mol H₂."},

{q:"Using 2H₂ + O₂ → 2H₂O, how many moles of H₂O are produced from 5.0 mol H₂?",c:["2.5 mol","5.0 mol","7.5 mol","10.0 mol"],a:1,e:"The mole ratio between H₂ and H₂O is 1:1."},

{q:"What is the correct first step in a mass-to-mass stoichiometry problem?",c:["Apply the mole ratio","Convert mass to moles","Calculate percent yield","Convert grams to liters"],a:1,e:"Stoichiometric calculations must first convert mass into moles."},

{q:"Which quantity acts as the bridge between reactants and products in stoichiometry?",c:["Mass","Volume","Moles","Density"],a:2,e:"Moles connect substances through mole ratios."},

{q:"Using CH₄ + 2O₂ → CO₂ + 2H₂O, how many moles of O₂ are required for 3.0 mol CH₄?",c:["1.5 mol","3.0 mol","4.0 mol","6.0 mol"],a:3,e:"3.0 mol CH₄ × (2 mol O₂ / 1 mol CH₄) = 6.0 mol O₂."},

{q:"Which conversion factor should be used to convert from moles of N₂ to moles of NH₃ in N₂ + 3H₂ → 2NH₃?",c:["1 mol N₂ / 2 mol NH₃","2 mol NH₃ / 1 mol N₂","3 mol H₂ / 1 mol N₂","1 mol NH₃ / 3 mol H₂"],a:1,e:"The desired substance should be in the numerator."},

{q:"Using 2KClO₃ → 2KCl + 3O₂, how many moles of O₂ are produced from 4.0 mol KClO₃?",c:["2.0 mol","4.0 mol","6.0 mol","8.0 mol"],a:2,e:"4.0 mol KClO₃ × (3 mol O₂ / 2 mol KClO₃) = 6.0 mol O₂."},

{q:"What is the molar mass of CO₂?",c:["28.01 g/mol","32.00 g/mol","40.01 g/mol","44.01 g/mol"],a:3,e:"CO₂ = 12.01 + (2 × 16.00) = 44.01 g/mol."},

{q:"Using CH₄ + 2O₂ → CO₂ + 2H₂O, how many grams of CO₂ are produced from 2.0 mol CH₄?",c:["44.01 g","66.02 g","88.02 g","132.03 g"],a:2,e:"2.0 mol CO₂ × 44.01 g/mol = 88.02 g CO₂."},

{q:"Which pathway correctly represents a typical mass-to-mass stoichiometry problem?",c:["Mass → Mole Ratio → Mass","Mass → Moles → Mole Ratio → Moles → Mass","Mass → Volume → Moles","Moles → Mass → Mole Ratio"],a:1,e:"Mass-to-mass stoichiometry requires converting through moles."},

{q:"Why are mole ratios based on coefficients rather than subscripts?",c:["Coefficients show reacting amounts","Subscripts represent molar mass","Coefficients indicate atomic masses","Subscripts can be changed"],a:0,e:"Coefficients represent the relative amounts of substances involved in the reaction."},

{q:"Using 2H₂ + O₂ → 2H₂O, how many moles of O₂ are needed for 10.0 mol H₂?",c:["2.5 mol","5.0 mol","10.0 mol","20.0 mol"],a:1,e:"10.0 mol H₂ × (1 mol O₂ / 2 mol H₂) = 5.0 mol O₂."},

{q:"Which mistake will always produce incorrect stoichiometric results?",c:["Using scientific notation","Balancing the equation first","Using an unbalanced equation","Converting grams to moles"],a:2,e:"An unbalanced equation gives incorrect mole ratios."},

{q:"A balanced equation acts like a recipe because it:",c:["Shows reaction speed","Provides quantitative relationships between substances","Identifies reaction types","Lists atomic numbers"],a:1,e:"The coefficients indicate how much of each substance reacts or forms."},

{q:"Which statement best summarizes stoichiometry?",c:["It predicts reaction colors","It calculates quantities of reactants and products using balanced equations","It classifies compounds","It determines atomic structure"],a:1,e:"Stoichiometry uses balanced equations and mole ratios to calculate chemical quantities."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
