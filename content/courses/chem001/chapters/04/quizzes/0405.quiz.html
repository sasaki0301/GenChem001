<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chapter 4 Assessment: Chemical Reactions and Stoichiometry</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Chapter 4 Assessment: Chemical Reactions and Stoichiometry</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"What is the primary purpose of balancing a chemical equation?",c:["To identify products","To satisfy the Law of Conservation of Mass","To determine reaction rate","To calculate molar mass"],a:1,e:"Balancing ensures equal numbers of each atom on both sides of the equation."},

{q:"Which part of a chemical equation may be changed during balancing?",c:["Subscripts","Chemical formulas","Coefficients","Element symbols"],a:2,e:"Only coefficients may be changed when balancing equations."},

{q:"In a chemical equation, products are found:",c:["On the left side","On the right side","Above the arrow","Below the arrow"],a:1,e:"Products appear on the right side of the arrow."},

{q:"Balance: Mg + O₂ → MgO",c:["Mg + O₂ → MgO","2Mg + O₂ → 2MgO","Mg + 2O₂ → MgO","2Mg + 2O₂ → 2MgO"],a:1,e:"The balanced equation is 2Mg + O₂ → 2MgO."},

{q:"Balance: Al + O₂ → Al₂O₃",c:["2Al + O₂ → Al₂O₃","4Al + 3O₂ → 2Al₂O₃","Al + O₂ → Al₂O₃","2Al + 3O₂ → Al₂O₃"],a:1,e:"The balanced equation is 4Al + 3O₂ → 2Al₂O₃."},

{q:"Balance: Fe + O₂ → Fe₂O₃",c:["2Fe + O₂ → Fe₂O₃","4Fe + 3O₂ → 2Fe₂O₃","4Fe + O₂ → 2Fe₂O₃","2Fe + 3O₂ → Fe₂O₃"],a:1,e:"This equation balances as 4Fe + 3O₂ → 2Fe₂O₃."},

{q:"Why should subscripts never be changed during balancing?",c:["They affect reaction speed","They determine the identity of the substance","They represent coefficients","They change molar mass only"],a:1,e:"Changing subscripts changes the chemical formula and substance identity."},

{q:"Which statement best describes a balanced equation?",c:["Equal coefficients","Equal masses only","Equal atoms of each element","Equal molecules"],a:2,e:"Balanced equations have equal numbers of each type of atom on both sides."},

{q:"Which reaction type follows the pattern A + B → AB?",c:["Combustion","Decomposition","Synthesis","Single Replacement"],a:2,e:"Synthesis reactions combine substances into one product."},

{q:"Which reaction type follows the pattern AB → A + B?",c:["Synthesis","Combustion","Double Replacement","Decomposition"],a:3,e:"Decomposition reactions break compounds apart."},

{q:"Which reaction type follows A + BC → AC + B?",c:["Single Replacement","Double Replacement","Combustion","Synthesis"],a:0,e:"One element replaces another in a compound."},

{q:"Which reaction type follows AB + CD → AD + CB?",c:["Combustion","Double Replacement","Single Replacement","Synthesis"],a:1,e:"The compounds exchange ions."},

{q:"Which reaction type always requires oxygen as a reactant?",c:["Combustion","Synthesis","Decomposition","Double Replacement"],a:0,e:"Combustion reactions require oxygen gas."},

{q:"Identify the reaction type: Zn + CuSO₄ → ZnSO₄ + Cu",c:["Combustion","Single Replacement","Double Replacement","Synthesis"],a:1,e:"Zinc replaces copper in the compound."},

{q:"Identify the reaction type: AgNO₃ + NaCl → AgCl + NaNO₃",c:["Single Replacement","Combustion","Double Replacement","Decomposition"],a:2,e:"The ions exchange partners."},

{q:"What is stoichiometry?",c:["Study of atomic structure","Study of reaction rates","Quantitative relationships in reactions","Classification of compounds"],a:2,e:"Stoichiometry calculates amounts of reactants and products."},

{q:"What provides the mole ratios used in stoichiometry?",c:["Subscripts","Atomic numbers","Balanced equation coefficients","Periodic table groups"],a:2,e:"Coefficients provide the mole relationships."},

{q:"In N₂ + 3H₂ → 2NH₃, what is the mole ratio of H₂ to NH₃?",c:["1:2","2:3","3:2","1:3"],a:2,e:"The coefficients show a ratio of 3 mol H₂ to 2 mol NH₃."},

{q:"Using N₂ + 3H₂ → 2NH₃, how many moles of NH₃ are produced from 3.0 mol N₂?",c:["3.0 mol","4.0 mol","6.0 mol","9.0 mol"],a:2,e:"3.0 mol N₂ × (2/1) = 6.0 mol NH₃."},

{q:"Using 2H₂ + O₂ → 2H₂O, how many moles of H₂O are produced from 8.0 mol H₂?",c:["4.0 mol","8.0 mol","12.0 mol","16.0 mol"],a:1,e:"The mole ratio between H₂ and H₂O is 1:1."},

{q:"Using CH₄ + 2O₂ → CO₂ + 2H₂O, how many moles of O₂ are required for 4.0 mol CH₄?",c:["2.0 mol","4.0 mol","6.0 mol","8.0 mol"],a:3,e:"4.0 × 2 = 8.0 mol O₂."},

{q:"What is the molar mass of CO₂?",c:["28.01 g/mol","32.00 g/mol","40.01 g/mol","44.01 g/mol"],a:3,e:"CO₂ = 12.01 + (2 × 16.00)."},

{q:"How many grams of CO₂ are produced from 2.0 mol CO₂?",c:["22.01 g","44.01 g","88.02 g","132.03 g"],a:2,e:"2.0 × 44.01 = 88.02 g."},

{q:"Which pathway correctly represents a mass-to-mass stoichiometry problem?",c:["Mass → Mole Ratio → Mass","Mass → Moles → Mole Ratio → Moles → Mass","Mass → Volume → Mass","Moles → Mass → Moles"],a:1,e:"Mass-to-mass calculations must pass through moles."},

{q:"Why are moles considered the bridge in stoichiometric calculations?",c:["They measure temperature","They connect substances through mole ratios","They determine reaction type","They measure volume"],a:1,e:"Moles allow conversion between reactants and products."},

{q:"Using 2KClO₃ → 2KCl + 3O₂, how many moles of O₂ are produced from 6.0 mol KClO₃?",c:["3.0 mol","6.0 mol","9.0 mol","12.0 mol"],a:2,e:"6.0 × (3/2) = 9.0 mol O₂."},

{q:"What is a limiting reactant?",c:["Reactant with largest mass","Reactant consumed first","Reactant remaining after reaction","Catalyst"],a:1,e:"The limiting reactant determines the maximum amount of product formed."},

{q:"What is an excess reactant?",c:["Reactant consumed first","Reactant remaining after reaction","Product formed","Catalyst"],a:1,e:"The excess reactant is left over after the reaction ends."},

{q:"In N₂ + 3H₂ → 2NH₃, if 1.0 mol N₂ reacts with 2.0 mol H₂, which is limiting?",c:["N₂","H₂","NH₃","Neither"],a:1,e:"1 mol N₂ requires 3 mol H₂, but only 2 mol H₂ is available."},

{q:"In N₂ + 3H₂ → 2NH₃, if 2.0 mol N₂ reacts with 10.0 mol H₂, which is limiting?",c:["N₂","H₂","NH₃","Neither"],a:0,e:"2 mol N₂ requires only 6 mol H₂, so N₂ is limiting."},

{q:"What is theoretical yield?",c:["Actual amount collected","Maximum amount predicted","Remaining reactant","Reaction efficiency"],a:1,e:"Theoretical yield is calculated from stoichiometry."},

{q:"What is actual yield?",c:["Maximum possible product","Product predicted by theory","Product actually obtained","Percent of product formed"],a:2,e:"Actual yield is the amount collected experimentally."},

{q:"Which formula calculates percent yield?",c:["(Theoretical ÷ Actual) × 100","(Actual ÷ Theoretical) × 100","Actual − Theoretical","Actual + Theoretical"],a:1,e:"Percent yield compares actual yield to theoretical yield."},

{q:"A reaction has an actual yield of 72 g and a theoretical yield of 80 g. What is the percent yield?",c:["80%","85%","90%","95%"],a:2,e:"(72 ÷ 80) × 100 = 90%."},

{q:"Why are actual yields often lower than theoretical yields?",c:["Matter is destroyed","Products are lost or reactions are incomplete","Balanced equations are wrong","Molar masses change"],a:1,e:"Real reactions are rarely perfectly efficient."},

{q:"Which statement best summarizes Chapter 4?",c:["Chemical reactions only involve balancing equations","Stoichiometry, limiting reactants, and percent yield allow chemists to predict and evaluate reaction outcomes","Reaction types determine atomic structure","Mole ratios are unrelated to chemical equations"],a:1,e:"Chapter 4 combines reaction understanding with quantitative chemical calculations."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
