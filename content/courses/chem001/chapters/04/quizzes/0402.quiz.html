<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Types of Chemical Reactions</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Types of Chemical Reactions - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"Which reaction type follows the general pattern A + B → AB?",c:["Decomposition","Single Replacement","Synthesis","Combustion"],a:2,e:"Synthesis reactions combine two or more substances into a single product."},

{q:"Which reaction type follows the general pattern AB → A + B?",c:["Combustion","Decomposition","Double Replacement","Synthesis"],a:1,e:"Decomposition reactions break a compound into simpler substances."},

{q:"Which reaction type follows the pattern A + BC → AC + B?",c:["Single Replacement","Double Replacement","Synthesis","Combustion"],a:0,e:"A single replacement reaction occurs when one element replaces another in a compound."},

{q:"Which reaction type follows the pattern AB + CD → AD + CB?",c:["Combustion","Single Replacement","Double Replacement","Synthesis"],a:2,e:"Double replacement reactions involve the exchange of ions between compounds."},

{q:"What is always a reactant in a combustion reaction?",c:["Hydrogen","Nitrogen","Oxygen","Carbon dioxide"],a:2,e:"Combustion reactions require oxygen gas (O₂)."},

{q:"Identify the reaction type: 2Na + Cl₂ → 2NaCl",c:["Combustion","Synthesis","Single Replacement","Decomposition"],a:1,e:"Two reactants combine to form one product."},

{q:"Identify the reaction type: 2HgO → 2Hg + O₂",c:["Synthesis","Combustion","Decomposition","Double Replacement"],a:2,e:"One compound breaks into simpler substances."},

{q:"Identify the reaction type: Zn + CuSO₄ → ZnSO₄ + Cu",c:["Double Replacement","Combustion","Single Replacement","Synthesis"],a:2,e:"Zinc replaces copper in the compound."},

{q:"Identify the reaction type: AgNO₃ + NaCl → AgCl + NaNO₃",c:["Synthesis","Combustion","Single Replacement","Double Replacement"],a:3,e:"The ions exchange partners."},

{q:"Identify the reaction type: CH₄ + 2O₂ → CO₂ + 2H₂O",c:["Combustion","Synthesis","Single Replacement","Double Replacement"],a:0,e:"Methane reacts with oxygen to produce carbon dioxide and water."},

{q:"Which reaction type usually produces only one product?",c:["Double Replacement","Combustion","Synthesis","Decomposition"],a:2,e:"Synthesis reactions typically form a single product."},

{q:"Which reaction type usually starts with only one reactant?",c:["Combustion","Single Replacement","Decomposition","Double Replacement"],a:2,e:"Decomposition reactions begin with a single compound."},

{q:"In a single replacement reaction, whether a reaction occurs often depends on:",c:["Temperature only","Reactivity of the elements","Color of the compounds","Number of products"],a:1,e:"The replacing element must be more reactive than the element being replaced."},

{q:"Which reaction type commonly occurs when two ionic compounds in solution are mixed?",c:["Combustion","Double Replacement","Synthesis","Decomposition"],a:1,e:"Double replacement reactions frequently occur in aqueous solutions."},

{q:"Which reaction type is represented by photosynthesis?",c:["Decomposition","Combustion","Synthesis","Single Replacement"],a:2,e:"Photosynthesis combines simpler substances to form glucose."},

{q:"Which reaction type is represented by the breakdown of hydrogen peroxide into water and oxygen?",c:["Combustion","Double Replacement","Synthesis","Decomposition"],a:3,e:"Hydrogen peroxide decomposes into simpler substances."},

{q:"A hydrocarbon reacts completely with oxygen. The products are most likely:",c:["CO₂ and H₂O","CO and H₂","NaCl and H₂O","H₂O only"],a:0,e:"Complete combustion of hydrocarbons produces carbon dioxide and water."},

{q:"Which reaction is an example of a single replacement reaction?",c:["2KClO₃ → 2KCl + 3O₂","Mg + 2HCl → MgCl₂ + H₂","H₂ + Cl₂ → 2HCl","AgNO₃ + NaCl → AgCl + NaNO₃"],a:1,e:"Magnesium replaces hydrogen in hydrochloric acid."},

{q:"Which reaction is an example of a double replacement reaction?",c:["Zn + CuSO₄ → ZnSO₄ + Cu","2Na + Cl₂ → 2NaCl","BaCl₂ + Na₂SO₄ → BaSO₄ + 2NaCl","2H₂O → 2H₂ + O₂"],a:2,e:"The ions exchange partners, forming new compounds."},

{q:"Why do chemists classify reactions into types?",c:["To determine atomic masses","To predict products and understand reaction patterns","To calculate molar masses","To balance equations automatically"],a:1,e:"Recognizing reaction patterns helps predict products and understand chemical behavior."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
