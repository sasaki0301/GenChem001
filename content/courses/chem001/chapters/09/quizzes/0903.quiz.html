<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Basic Functional Groups</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Basic Functional Groups - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"What is a functional group?",c:["A chain of carbon atoms","A specific atom or group of atoms that determines the properties and reactions of an organic compound","A type of hydrocarbon","A carbon-carbon double bond"],a:1,e:"Functional groups are specific atoms or groups of atoms responsible for the characteristic properties and reactions of organic compounds."},

{q:"Which statement best describes the role of a functional group?",c:["It determines the atomic mass of a compound.","It determines the chemical behavior of an organic compound.","It determines the number of carbon atoms.","It determines the molecular weight only."],a:1,e:"Functional groups largely determine how organic compounds react and what physical properties they exhibit."},

{q:"Which functional group is found in alcohols?",c:["–COOH","–OH","–NH₂","–CHO"],a:1,e:"Alcohols contain the hydroxyl (–OH) functional group."},

{q:"Which compound contains an alcohol functional group?",c:["Acetone","Ethanol","Acetic Acid","Diethyl Ether"],a:1,e:"Ethanol contains the hydroxyl (–OH) group."},

{q:"Which functional group is present in ethers?",c:["–O–","–OH","–COOH","–CHO"],a:0,e:"Ethers contain an oxygen atom connecting two carbon groups (R–O–R')."},

{q:"Which compound is an ether?",c:["Methanol","Diethyl Ether","Acetone","Acetic Acid"],a:1,e:"Diethyl ether contains the ether functional group."},

{q:"Which functional group characterizes aldehydes?",c:["–CHO","–COOH","–NH₂","–OH"],a:0,e:"Aldehydes contain a terminal carbonyl group represented by –CHO."},

{q:"What distinguishes an aldehyde from a ketone?",c:["Aldehydes contain nitrogen.","The carbonyl group of an aldehyde is located at the end of the carbon chain.","Ketones contain oxygen.","Ketones always contain double bonds."],a:1,e:"Aldehydes have a terminal carbonyl group, while ketones have an internal carbonyl group."},

{q:"Which compound is an aldehyde?",c:["Acetone","Formaldehyde","Ethanol","Ethyl Acetate"],a:1,e:"Formaldehyde is the simplest aldehyde."},

{q:"Which functional group is found in ketones?",c:["Internal carbonyl group","Hydroxyl group","Carboxyl group","Amino group"],a:0,e:"Ketones contain a carbonyl group attached to two carbon atoms."},

{q:"Which common solvent is classified as a ketone?",c:["Acetone","Ethanol","Acetic Acid","Methane"],a:0,e:"Acetone is a widely used ketone solvent."},

{q:"Which functional group is present in carboxylic acids?",c:["–COOH","–CHO","–NH₂","–OH"],a:0,e:"Carboxylic acids contain the carboxyl group (–COOH)."},

{q:"Which household substance contains acetic acid?",c:["Cooking oil","Vinegar","Milk","Sugar"],a:1,e:"Acetic acid is the main acid found in vinegar."},

{q:"Which functional group is commonly associated with fruity aromas?",c:["Alcohol","Ketone","Ester","Amide"],a:2,e:"Esters are responsible for many fruity flavors and fragrances."},

{q:"Which compound is classified as an ester?",c:["Ethyl Acetate","Methanol","Acetone","Methylamine"],a:0,e:"Ethyl acetate is an ester commonly used as a solvent."},

{q:"Which functional group contains nitrogen and is generally basic?",c:["Alcohol","Amine","Ester","Ketone"],a:1,e:"Amines contain nitrogen and often exhibit basic properties."},

{q:"Which compound is an amine?",c:["Acetamide","Methylamine","Acetic Acid","Diethyl Ether"],a:1,e:"Methylamine contains the amino (–NH₂) group."},

{q:"Which functional group is found in proteins?",c:["Alcohol","Amide","Ether","Aldehyde"],a:1,e:"Proteins are composed of amino acids linked by amide (peptide) bonds."},

{q:"Which compound is classified as an amide?",c:["Acetamide","Acetone","Ethanol","Ethyl Acetate"],a:0,e:"Acetamide contains the amide functional group."},

{q:"Why do alcohols generally have higher boiling points than hydrocarbons of similar size?",c:["They contain more carbon atoms.","They form hydrogen bonds.","They are ionic compounds.","They have lower molecular masses."],a:1,e:"Hydrogen bonding significantly increases the boiling points of alcohols."},

{q:"Which functional group is primarily responsible for the acidity of vinegar?",c:["Alcohol","Carboxylic Acid","Ketone","Ether"],a:1,e:"The carboxyl group can donate H⁺ ions, making carboxylic acids acidic."},

{q:"Which pair is correctly matched?",c:["Acetone — Alcohol","Ethanol — Ester","Formaldehyde — Aldehyde","Acetic Acid — Ether"],a:2,e:"Formaldehyde is an aldehyde containing a terminal carbonyl group."},

{q:"Which functional group is most likely to increase the water solubility of an organic compound?",c:["Hydroxyl (–OH)","Carbon chain","Benzene ring","Carbon-carbon double bond"],a:0,e:"The hydroxyl group is polar and can form hydrogen bonds with water."},

{q:"A compound has the formula CH₃COOH. Which functional group does it contain?",c:["Alcohol","Ketone","Carboxylic Acid","Amine"],a:2,e:"CH₃COOH is acetic acid, which contains the carboxyl group."},

{q:"A compound has the formula CH₃CH₂OH. Which functional group is present?",c:["Alcohol","Aldehyde","Ketone","Amide"],a:0,e:"CH₃CH₂OH is ethanol, an alcohol."},

{q:"A compound has the formula CH₃COCH₃. Which functional group does it contain?",c:["Ketone","Alcohol","Ester","Amine"],a:0,e:"CH₃COCH₃ (acetone) contains an internal carbonyl group, making it a ketone."},

{q:"Which functional group is commonly used in perfumes and artificial fruit flavorings?",c:["Amides","Esters","Amines","Carboxylic Acids"],a:1,e:"Many esters have pleasant fruity aromas and are used in fragrances and flavorings."},

{q:"A pharmaceutical chemist is designing a medicine that must dissolve well in water. Which functional group would generally increase water solubility?",c:["Hydroxyl (–OH)","Long hydrocarbon chain","Benzene ring","Alkyl group"],a:0,e:"Hydroxyl groups increase polarity and hydrogen bonding with water."},

{q:"Which statement best summarizes the importance of functional groups?",c:["They determine only the molecular mass.","They determine the physical and chemical properties of organic compounds.","They determine the number of carbon atoms.","They are found only in hydrocarbons."],a:1,e:"Functional groups govern the reactivity, polarity, solubility, and many other properties of organic compounds."},

{q:"A chemist identifies a molecule containing both a benzene ring and a –COOH group. Which functional group is present?",c:["Alcohol","Carboxylic Acid","Ketone","Ether"],a:1,e:"The –COOH group identifies the compound as containing a carboxylic acid functional group, regardless of the benzene ring."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
