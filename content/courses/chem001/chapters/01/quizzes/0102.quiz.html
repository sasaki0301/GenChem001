<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 1 – Lesson 2 Quiz: Density of Solids</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e8f9f1, #f7faff);
    margin: 0;
    padding: 40px 20px;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .quiz-container {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    width: 95%;
    max-width: 850px;
    text-align: center;
  }

  * { box-sizing: border-box; }
  .choice:focus-visible, button:focus-visible { outline: 3px solid #ad7115; outline-offset: 3px; }
  .choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
  .choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
  .choice:disabled { opacity: 1; cursor: default; }
  .quiz-btn:disabled { opacity: .5; cursor: not-allowed; }
  h2 {
    color: #136f63;
    margin-bottom: 25px;
    font-size: 1.8em;
  }

  /* Progress */
  .progress-text {
    text-align: right;
    font-size: 0.95em;
    color: #174ea6;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .progress-wrapper {
    background: #e9f5ef;
    border-radius: 8px;
    height: 14px;
    width: 100%;
    margin-bottom: 25px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Question */
  .question {
    font-size: 1.3em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }
  .choice {
    background: #e8ecf8;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    font-size: 1.05em;
    transition: 0.2s;
  }
  .choice:hover { background: #d3dbf8; transform: translateY(-2px); }
  .choice.selected { background: #174ea6; color: #fff; transform: scale(1.02); }

  .explanation {
    background: #eef3ff;
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 10px;
    display: none;
    text-align: left;
    font-size: 1.05em;
  }

  /* Buttons */
  .next-btn {
    background: #136f63;
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1.05em;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 15px;
  }
  .next-btn:hover { background: #0f5b52; }

  /* Result */
  .result {
    font-size: 1.4em;
    font-weight: bold;
    color: #174ea6;
    margin-top: 12px;
  }
  .stars {
    font-size: 2.5em;
    margin-top: 10px;
  }

  .quiz-nav {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .quiz-btn {
    background: #e8ecf8;
    color: #174ea6;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 0.95em;
    transition: 0.2s;
  }
  .quiz-btn:hover { background: #d3dbf8; transform: translateY(-2px); }
  .quiz-btn.primary { background: #136f63; color: #fff; }
  .quiz-btn.primary:hover { background: #0f5b52; }

  @media(max-width:600px){
    .quiz-container { padding: 25px; }
    .question { font-size: 1.15em; }
    .stars { font-size: 2em; }
  }
.choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
.choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
</style>
</head>

<body>

<div class="quiz-container">
  <h2>Lesson 2 Quiz – Density of Solids</h2>

  <p>10 questions · Pass: 8/10 (80% required). Choose one answer; your first choice is final. Read the explanation before continuing.</p>
  <div id="progressText" class="progress-text">Question 1 of 10</div>
  <div class="progress-wrapper"><div id="progressBar" class="progress-bar"></div></div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
/* ============================
     QUIZ DATA
============================= */

const quizData = [
  {
    "q": "What does the density of a solid describe?",
    "c": [
      "The mass contained in each unit of volume",
      "The force of gravity on the solid",
      "The total space occupied by the solid",
      "The temperature at which the solid melts"
    ],
    "a": 0,
    "e": "Density compares mass with volume: density = mass ÷ volume."
  },
  {
    "q": "A solid has a mass of 24.0 g and a volume of 8.0 cm³. What is its density?",
    "c": [
      "0.33 g/cm³",
      "3.0 g/cm³",
      "16 g/cm³",
      "192 g/cm³"
    ],
    "a": 1,
    "e": "Divide mass by volume: 24.0 g ÷ 8.0 cm³ = 3.0 g/cm³."
  },
  {
    "q": "A sample has a density of 2.5 g/mL. Which statement best interprets this value?",
    "c": [
      "The entire sample has a mass of exactly 2.5 g",
      "The sample has a volume of 2.5 mL",
      "Each milliliter of the sample has a mass of approximately 2.5 g",
      "Every 2.5 g of the sample occupies 2.5 mL"
    ],
    "a": 2,
    "e": "A density of 2.5 g/mL means about 2.5 g of the material occupies each milliliter."
  },
  {
    "q": "A rectangular solid measures 3.0 cm × 2.0 cm × 2.0 cm and has a mass of 30.0 g. What is its density?",
    "c": [
      "0.40 g/cm³",
      "2.5 g/cm³",
      "12 g/cm³",
      "2.5 cm³/g"
    ],
    "a": 1,
    "e": "The volume is 3.0 × 2.0 × 2.0 = 12 cm³. Density = 30.0 ÷ 12 = 2.5 g/cm³."
  },
  {
    "q": "A stone has a mass of 32.4 g. Water rises from 17.0 mL to 29.0 mL when it is fully submerged. What is the stone’s density?",
    "c": [
      "1.12 g/mL",
      "1.91 g/mL",
      "2.70 g/mL",
      "3.24 g/mL"
    ],
    "a": 2,
    "e": "The stone displaces 29.0 − 17.0 = 12.0 mL. Density = 32.4 g ÷ 12.0 mL = 2.70 g/mL."
  },
  {
    "q": "Two samples each occupy 5.0 cm³. Sample A has a mass of 10.0 g; sample B has a mass of 15.0 g. What can be concluded?",
    "c": [
      "Sample A is denser because it has less mass",
      "Sample B is denser because it has more mass in the same volume",
      "Both have the same density because their volumes are equal",
      "The density cannot be compared without knowing their shapes"
    ],
    "a": 1,
    "e": "For the same volume, the sample with greater mass has greater density: A is 2.0 g/cm³ and B is 3.0 g/cm³."
  },
  {
    "q": "A uniform metal is cut into two smaller pieces. Assuming its temperature and composition stay the same, what happens to the density of each piece?",
    "c": [
      "It increases as the pieces become smaller",
      "It decreases in proportion to the volume",
      "It remains the same as that of the original sample",
      "It becomes zero because mass was removed"
    ],
    "a": 2,
    "e": "Each piece has less mass and less volume, but for the same uniform material under the same conditions, their ratio remains the same."
  },
  {
    "q": "An object has an overall density of 0.80 g/mL. What is expected when it is placed in water with a density of 1.0 g/mL?",
    "c": [
      "It sinks because its density is lower than water",
      "It floats because its overall density is lower than water",
      "It sinks because its mass is less than 1.0 g",
      "It must remain completely submerged because all solids sink"
    ],
    "a": 1,
    "e": "An object with an overall density lower than the liquid’s density is expected to float."
  },
  {
    "q": "While measuring an irregular solid by water displacement, a student notices trapped air bubbles attached to it. How could these bubbles affect the calculated density?",
    "c": [
      "The measured displaced volume may be too large, making the calculated density too low",
      "The measured displaced volume may be too small, making the calculated density too high",
      "The mass will increase and the volume will stay unchanged",
      "The volume will be unaffected because air has no volume"
    ],
    "a": 0,
    "e": "Attached bubbles displace additional water. If the measured mass is unchanged, an overestimated volume produces an underestimated density."
  },
  {
    "q": "Which report best communicates a density investigation?",
    "c": [
      "“The sample was dense.”",
      "“The sample had a mass of 18.0 g.”",
      "“The sample had a mass of 18.0 g and a volume of 6.0 cm³, giving a density of 3.0 g/cm³.”",
      "“The sample displaced water, so it was made of metal.”"
    ],
    "a": 2,
    "e": "A useful report includes the measured mass and volume, the calculated density, and units. Density alone does not establish an unknown material’s identity."
  }
];

/* ============================
       QUIZ LOGIC
============================= */

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
    <div class='choices'></div>
    <div class='explanation' id='explanationBox' role='status' aria-live='polite'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;
  selected = i;
  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.classList.toggle("selected", idx === i);
    if (idx === quizData[current].a) btn.classList.add("correct");
    if (idx === i && i !== quizData[current].a) btn.classList.add("incorrect");
    btn.disabled = true;
  });
  const q = quizData[current];
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br><strong>Correct answer:</strong> ${q.c[q.a]}<br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Sending your result to LearnTrack...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Result sent to LearnTrack. You may proceed."
      : "Result sent to LearnTrack. Retake the quiz to meet the 80% target.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();

</script>
</body>
</html>
