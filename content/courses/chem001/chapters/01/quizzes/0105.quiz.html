<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 1 – Lesson 5 Quiz: Accuracy, Precision, and Errors</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e8f9f1, #f7faff);
    margin: 0;
    padding: 40px 20px;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .quiz-container {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    width: 95%;
    max-width: 850px;
    text-align: center;
  }

  * { box-sizing: border-box; }
  .choice:focus-visible, button:focus-visible { outline: 3px solid #ad7115; outline-offset: 3px; }
  .choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
  .choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
  .choice:disabled { opacity: 1; cursor: default; }
  .quiz-btn:disabled { opacity: .5; cursor: not-allowed; }
  h2 {
    color: #136f63;
    margin-bottom: 25px;
    font-size: 1.8em;
  }

  /* Progress */
  .progress-text {
    text-align: right;
    font-size: 0.95em;
    color: #174ea6;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .progress-wrapper {
    background: #e9f5ef;
    border-radius: 8px;
    height: 14px;
    width: 100%;
    margin-bottom: 25px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Question */
  .question {
    font-size: 1.3em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }
  .choice {
    background: #e8ecf8;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    font-size: 1.05em;
    transition: 0.2s;
  }
  .choice:hover { background: #d3dbf8; transform: translateY(-2px); }
  .choice.selected { background: #174ea6; color: #fff; transform: scale(1.02); }

  .explanation {
    background: #eef3ff;
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 10px;
    display: none;
    text-align: left;
    font-size: 1.05em;
  }

  /* Buttons */
  .next-btn {
    background: #136f63;
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1.05em;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 15px;
  }
  .next-btn:hover { background: #0f5b52; }

  /* Result */
  .result {
    font-size: 1.4em;
    font-weight: bold;
    color: #174ea6;
    margin-top: 12px;
  }
  .stars {
    font-size: 2.5em;
    margin-top: 10px;
  }

  .quiz-nav {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .quiz-btn {
    background: #e8ecf8;
    color: #174ea6;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 0.95em;
    transition: 0.2s;
  }
  .quiz-btn:hover { background: #d3dbf8; transform: translateY(-2px); }
  .quiz-btn.primary { background: #136f63; color: #fff; }
  .quiz-btn.primary:hover { background: #0f5b52; }

  @media(max-width:600px){
    .quiz-container { padding: 25px; }
    .question { font-size: 1.15em; }
    .stars { font-size: 2em; }
  }
.choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
.choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
</style>
</head>

<body>

<div class="quiz-container">
  <h2>Lesson 5 Quiz – Accuracy, Precision, and Errors</h2>

  <p>10 questions · Pass: 8/10 (80% required). Choose one answer; your first choice is final. Read the explanation before continuing.</p>
  <div id="progressText" class="progress-text">Question 1 of 10</div>
  <div class="progress-wrapper"><div id="progressBar" class="progress-bar"></div></div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
/* ============================
     QUIZ DATA
============================= */

const quizData = [
  {
    "q": "What does accuracy describe in a measurement?",
    "c": [
      "Closeness to the true value, often assessed using a suitable reference",
      "Closeness among repeated measurements",
      "The number of digits shown on the instrument",
      "The time needed to make the measurement"
    ],
    "a": 0,
    "e": "Accuracy concerns closeness to the true value. A suitable accepted or reference value is often used to assess it."
  },
  {
    "q": "A student measures the same sample three times and obtains 8.14 g, 8.15 g, and 8.16 g. What can be concluded without a reference value?",
    "c": [
      "The results are definitely accurate",
      "The results have a small spread, but closeness to a reference is unknown",
      "The results are inaccurate because the readings differ",
      "The balance must have a systematic error"
    ],
    "a": 1,
    "e": "The measurements are closely grouped, suggesting good precision in these trials. Accuracy cannot be determined from their spread alone."
  },
  {
    "q": "A reference mass is 20.00 g. A group obtains 19.49 g, 19.50 g, and 19.51 g. Which description best fits the results?",
    "c": [
      "Tightly grouped and close to the reference",
      "Widely spread with a mean close to the reference",
      "Tightly grouped with a mean far from the reference",
      "Widely spread with a mean far from the reference"
    ],
    "a": 2,
    "e": "The range is 0.02 g and the mean is 19.50 g, which is 0.50 g below the reference. The results are tightly grouped but displaced from the reference."
  },
  {
    "q": "A reference volume is 10.00 mL. A group obtains 9.70 mL, 10.00 mL, and 10.30 mL. What is the best interpretation?",
    "c": [
      "Every result is close to the reference and the spread is small",
      "The mean equals the reference, but the readings are widely spread",
      "The mean is below the reference and the spread is small",
      "The results prove the instrument has a constant offset"
    ],
    "a": 1,
    "e": "The mean is 10.00 mL, while the range is 0.60 mL. The close mean can result from cancellation even when individual readings are spread out."
  },
  {
    "q": "A balance is empty but consistently reads +0.15 g before a sample is placed on it. This offset is a possible example of which effect?",
    "c": [
      "Systematic bias",
      "Random variation only",
      "A change in sample volume",
      "A correct zero setting"
    ],
    "a": 0,
    "e": "A consistent zero offset can shift measurements in the same direction, making it a possible systematic bias."
  },
  {
    "q": "A balance gives fluctuating readings because the laboratory bench vibrates unpredictably. Which action best addresses the variation?",
    "c": [
      "Use a stable surface and reduce vibrations",
      "Add 0.15 g to every reading",
      "Report an extra decimal place",
      "Use the largest reading only"
    ],
    "a": 0,
    "e": "A stable, vibration-free surface helps reduce trial-to-trial variation caused by the moving bench."
  },
  {
    "q": "A student records a water meniscus from a different viewing angle on every trial. What change should improve the consistency of the readings?",
    "c": [
      "Read the bottom of the meniscus at eye level each time",
      "Read from a greater distance each time",
      "Alternate between reading the top and bottom",
      "Round each reading to the nearest liter"
    ],
    "a": 0,
    "e": "Using eye-level readings and the same procedure reduces variation caused by changing parallax."
  },
  {
    "q": "A balance has a constant positive zero offset. What happens if a student takes many readings and averages them without correcting the balance?",
    "c": [
      "The average necessarily eliminates the offset",
      "The average can remain biased by the offset",
      "The reference value automatically changes",
      "The readings will always become more accurate than the reference"
    ],
    "a": 1,
    "e": "Averaging can reduce random variation, but it does not remove a constant systematic offset. Check the zero and calibration."
  },
  {
    "q": "An accepted mass is 25.0 g and a measured mass is 24.0 g. What is the percent error?",
    "c": [
      "1%",
      "4%",
      "24%",
      "25%"
    ],
    "a": 1,
    "e": "Percent error = |24.0 − 25.0| ÷ 25.0 × 100% = 4%."
  },
  {
    "q": "Two reported measurements are 10.0 g and 10.00 g. What can be concluded from the additional displayed digit alone?",
    "c": [
      "10.00 g must be closer to the true value",
      "10.00 g is reported to a finer place, but accuracy is not established",
      "10.0 g must be inaccurate",
      "Both measurements have identical uncertainty"
    ],
    "a": 1,
    "e": "The value 10.00 g is reported to the hundredths place. Additional reported digits alone do not prove accuracy or establish a complete uncertainty range."
  }
];

/* ============================
       QUIZ LOGIC
============================= */

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
    <div class='choices'></div>
    <div class='explanation' id='explanationBox' role='status' aria-live='polite'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;
  selected = i;
  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.classList.toggle("selected", idx === i);
    if (idx === quizData[current].a) btn.classList.add("correct");
    if (idx === i && i !== quizData[current].a) btn.classList.add("incorrect");
    btn.disabled = true;
  });
  const q = quizData[current];
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br><strong>Correct answer:</strong> ${q.c[q.a]}<br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Sending your result to LearnTrack...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Result sent to LearnTrack. You may proceed."
      : "Result sent to LearnTrack. Retake the quiz to meet the 80% target.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();

</script>
</body>
</html>
