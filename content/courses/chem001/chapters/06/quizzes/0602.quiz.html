<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Writing Electron Configuration of Atoms</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Writing Electron Configuration of Atoms - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"What does an electron configuration describe?",c:["The location of protons","The arrangement of electrons in an atom","The number of neutrons","The atomic mass"],a:1,e:"Electron configuration describes how electrons are distributed among orbitals and energy levels."},

{q:"Which principle states that electrons fill the lowest available energy orbitals first?",c:["Hund's Rule","Pauli Exclusion Principle","Aufbau Principle","Uncertainty Principle"],a:2,e:"The Aufbau Principle governs orbital filling order."},

{q:"Which electron configuration correctly represents hydrogen (Z = 1)?",c:["1s²","2s¹","1s¹","2p¹"],a:2,e:"Hydrogen has one electron occupying the 1s orbital."},

{q:"What is the maximum number of electrons that can occupy an s sublevel?",c:["1","2","6","10"],a:1,e:"An s sublevel contains one orbital that can hold two electrons."},

{q:"What is the maximum number of electrons that can occupy a p sublevel?",c:["2","4","6","8"],a:2,e:"Three p orbitals can hold a total of six electrons."},

{q:"Which principle states that no two electrons in an atom can have the same four quantum numbers?",c:["Aufbau Principle","Hund's Rule","Pauli Exclusion Principle","Bohr Principle"],a:2,e:"The Pauli Exclusion Principle governs electron occupancy in orbitals."},

{q:"According to Hund's Rule, electrons in equal-energy orbitals will:",c:["Pair immediately","Occupy orbitals singly before pairing","Always occupy the same orbital","Avoid p orbitals"],a:1,e:"Hund's Rule maximizes the number of unpaired electrons."},

{q:"Which orbital diagram correctly represents 2p³?",c:["↑↓ ↑ _","↑ ↑ ↑","↑↓ ↑↓ _","↑↓ ↑↓ ↑"],a:1,e:"Electrons occupy each p orbital singly before pairing."},

{q:"What is the electron configuration of helium (Z = 2)?",c:["1s¹","1s²","2s²","1s²2s¹"],a:1,e:"Helium has two electrons filling the 1s orbital."},

{q:"What is the electron configuration of lithium (Z = 3)?",c:["1s²2s¹","1s²2p¹","1s¹2s²","1s²2s²"],a:0,e:"Lithium has three electrons: 1s²2s¹."},

{q:"What is the electron configuration of carbon (Z = 6)?",c:["1s²2s²2p²","1s²2s²2p⁴","1s²2p⁴","1s²2s¹2p³"],a:0,e:"Carbon contains six electrons distributed as 1s²2s²2p²."},

{q:"What is the electron configuration of oxygen (Z = 8)?",c:["1s²2s²2p²","1s²2s²2p⁴","1s²2p⁶","1s²2s²2p⁶"],a:1,e:"Oxygen has eight electrons: 1s²2s²2p⁴."},

{q:"What is the electron configuration of sodium (Z = 11)?",c:["1s²2s²2p⁶3s¹","1s²2s²2p⁵3s²","1s²2s²3s²3p⁵","1s²2s²2p⁶3p¹"],a:0,e:"Sodium's eleventh electron enters the 3s orbital."},

{q:"What is the electron configuration of magnesium (Z = 12)?",c:["1s²2s²2p⁶3s¹","1s²2s²2p⁶3s²","1s²2s²2p⁶3p²","1s²2s²2p⁶3p¹"],a:1,e:"Magnesium has two electrons in the 3s orbital."},

{q:"What is the electron configuration of chlorine (Z = 17)?",c:["1s²2s²2p⁶3s²3p⁵","1s²2s²2p⁶3s²3p⁷","1s²2s²2p⁵3s²3p⁶","1s²2s²2p⁶3s¹3p⁶"],a:0,e:"Chlorine has seventeen electrons and ends with 3p⁵."},

{q:"Which electron configuration represents neon (Z = 10)?",c:["1s²2s²2p⁶","1s²2s²2p⁵","1s²2s²","1s²2s²2p⁴"],a:0,e:"Neon has a completely filled second energy level."},

{q:"What is the noble gas shorthand configuration of sodium?",c:["[He]2s²2p⁶3s¹","[Ne]3s¹","[Ar]3s¹","[Ne]3p¹"],a:1,e:"Neon is the preceding noble gas for sodium."},

{q:"What is the noble gas shorthand configuration of magnesium?",c:["[Ne]3s²","[Ar]3s²","[Ne]3p²","[He]2s²2p⁶3s²"],a:0,e:"Magnesium follows neon and has two electrons in 3s."},

{q:"What is the noble gas shorthand configuration of calcium?",c:["[Ar]4s²","[Ne]4s²","[Kr]4s²","[Ar]3d²"],a:0,e:"Calcium's valence electrons occupy the 4s orbital."},

{q:"Which element has the electron configuration [Ne]3s¹?",c:["Magnesium","Sodium","Aluminum","Neon"],a:1,e:"[Ne]3s¹ corresponds to sodium."},

{q:"How many valence electrons does sodium have?",c:["1","2","7","8"],a:0,e:"The outermost energy level contains one electron."},

{q:"How many valence electrons does magnesium have?",c:["1","2","6","8"],a:1,e:"Magnesium has the configuration [Ne]3s²."},

{q:"How many valence electrons does phosphorus have?",c:["3","4","5","6"],a:2,e:"Phosphorus has [Ne]3s²3p³, totaling five valence electrons."},

{q:"How many valence electrons does chlorine have?",c:["5","6","7","8"],a:2,e:"Chlorine's outer shell contains seven electrons."},

{q:"Which element is expected to be the most chemically stable?",c:["Sodium","Magnesium","Chlorine","Neon"],a:3,e:"Neon has a completely filled valence shell."},

{q:"Why are noble gases generally unreactive?",c:["They have no electrons","They have full valence shells","They have low atomic masses","They lack nuclei"],a:1,e:"A full valence shell provides exceptional stability."},

{q:"An atom has the electron configuration 1s²2s²2p⁶3s²3p¹. Which element is it?",c:["Magnesium","Aluminum","Silicon","Phosphorus"],a:1,e:"This configuration contains 13 electrons, corresponding to aluminum."},

{q:"An atom has the electron configuration 1s²2s²2p⁶3s²3p⁴. How many valence electrons does it have?",c:["4","5","6","8"],a:2,e:"The outer shell contains 3s²3p⁴, totaling six valence electrons."},

{q:"Which periodic table block contains elements whose configurations end in p orbitals?",c:["s-block","p-block","d-block","f-block"],a:1,e:"Elements ending in p orbitals belong to the p-block."},

{q:"Which statement best summarizes electron configuration?",c:["It identifies the number of neutrons","It describes how electrons are arranged and helps predict chemical behavior","It determines atomic mass only","It describes nuclear stability"],a:1,e:"Electron configuration explains electron arrangement, periodic trends, and chemical properties."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
