<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Visualizing the Quantum Mechanical Model and Assigning Quantum Numbers</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Visualizing the Quantum Mechanical Model and Assigning Quantum Numbers - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"Which atomic model first introduced the idea of a dense, positively charged nucleus?",c:["Dalton Model","Thomson Model","Rutherford Model","Bohr Model"],a:2,e:"Rutherford's gold foil experiment led to the discovery of the atomic nucleus."},

{q:"Which scientist proposed that electrons occupy fixed energy levels around the nucleus?",c:["Dalton","Rutherford","Bohr","Schrödinger"],a:2,e:"Bohr introduced quantized energy levels for electrons."},

{q:"Why was the Bohr Model eventually replaced by the Quantum Mechanical Model?",c:["It could not explain radioactive decay","It could not explain multi-electron atoms accurately","It did not contain electrons","It predicted the existence of neutrons"],a:1,e:"The Bohr Model worked well for hydrogen but failed for more complex atoms."},

{q:"Which modern atomic model describes electrons as probability distributions rather than fixed paths?",c:["Plum Pudding Model","Nuclear Model","Bohr Model","Quantum Mechanical Model"],a:3,e:"The Quantum Mechanical Model describes electron locations probabilistically."},

{q:"Wave-particle duality refers to the fact that electrons:",c:["Are both positive and negative","Behave as both particles and waves","Move in circular and elliptical orbits","Can exist in two atoms simultaneously"],a:1,e:"Electrons exhibit both particle-like and wave-like properties."},

{q:"Which experimental observation supports the wave nature of electrons?",c:["Photoelectric effect","Electron diffraction","Atomic emission spectra","Radioactive decay"],a:1,e:"Electron diffraction demonstrates wave-like behavior."},

{q:"According to Heisenberg's Uncertainty Principle, it is impossible to know simultaneously the exact:",c:["Mass and charge","Energy and charge","Position and momentum","Volume and velocity"],a:2,e:"The uncertainty principle limits simultaneous knowledge of position and momentum."},

{q:"What is an orbital?",c:["A fixed path traveled by an electron","A region where electrons cannot exist","A region of high probability of finding an electron","The nucleus of an atom"],a:2,e:"Orbitals represent probability distributions rather than fixed paths."},

{q:"Which statement about orbitals is correct?",c:["Orbitals are physical paths","Orbitals can hold unlimited electrons","Orbitals represent probable electron locations","Orbitals exist only in hydrogen"],a:2,e:"Orbitals are regions where electrons are most likely found."},

{q:"Which sublevel has a spherical shape?",c:["p","d","f","s"],a:3,e:"The s orbital is spherical."},

{q:"Which sublevel typically has a dumbbell shape?",c:["s","p","d","f"],a:1,e:"p orbitals have a characteristic dumbbell shape."},

{q:"How many orbitals are present in a p sublevel?",c:["1","2","3","5"],a:2,e:"A p sublevel contains three orbitals."},

{q:"How many electrons can occupy a d sublevel?",c:["2","6","10","14"],a:2,e:"Five d orbitals × 2 electrons each = 10 electrons."},

{q:"Which quantum number identifies the principal energy level?",c:["l","mₗ","mₛ","n"],a:3,e:"The principal quantum number n identifies the energy level."},

{q:"An electron located in the fourth energy level has which principal quantum number?",c:["1","2","3","4"],a:3,e:"The fourth energy level corresponds to n = 4."},

{q:"Which quantum number determines the shape of an orbital?",c:["n","l","mₗ","mₛ"],a:1,e:"The angular momentum quantum number l determines the sublevel and orbital shape."},

{q:"What is the value of l for a d orbital?",c:["0","1","2","3"],a:2,e:"The d sublevel corresponds to l = 2."},

{q:"Which quantum number identifies a specific orbital within a sublevel?",c:["n","l","mₗ","mₛ"],a:2,e:"The magnetic quantum number identifies individual orbitals."},

{q:"What are the possible mₛ values for an electron?",c:["0 and 1","−1 and +1","−½ and +½","−2 and +2"],a:2,e:"The spin quantum number can only be +½ or −½."},

{q:"A sodium valence electron occupies a 3s orbital. Which set of quantum numbers is possible?",c:["n=3, l=0, mₗ=0, mₛ=+½","n=3, l=1, mₗ=0, mₛ=+½","n=2, l=0, mₗ=0, mₛ=+½","n=3, l=2, mₗ=1, mₛ=+½"],a:0,e:"A 3s electron must have n=3 and l=0."},

{q:"For an electron in a 3p orbital, what is the value of l?",c:["0","1","2","3"],a:1,e:"The p sublevel corresponds to l = 1."},

{q:"Which set of quantum numbers describes an electron in a 4f orbital?",c:["n=4, l=0","n=4, l=1","n=4, l=2","n=4, l=3"],a:3,e:"The f sublevel corresponds to l = 3."},

{q:"How many orbitals exist in a d sublevel?",c:["1","3","5","7"],a:2,e:"A d sublevel contains five orbitals."},

{q:"How many orbitals exist in an f sublevel?",c:["3","5","7","14"],a:2,e:"An f sublevel contains seven orbitals."},

{q:"What is the maximum number of electrons that can occupy a single orbital?",c:["1","2","6","10"],a:1,e:"Each orbital can contain a maximum of two electrons."},

{q:"Why must the two electrons in the same orbital have opposite spins?",c:["Due to Hund's Rule","Due to the Uncertainty Principle","Due to the Pauli Exclusion Principle","Due to wave-particle duality"],a:2,e:"The Pauli Exclusion Principle requires opposite spins in the same orbital."},

{q:"Which sublevel can hold a maximum of 14 electrons?",c:["s","p","d","f"],a:3,e:"The f sublevel contains seven orbitals and can hold 14 electrons."},

{q:"A chlorine valence electron is located in the 3p sublevel. Which value of l must it have?",c:["0","1","2","3"],a:1,e:"All p electrons have l = 1."},

{q:"Which statement best describes the significance of quantum numbers?",c:["They identify the mass of an electron","They uniquely describe an electron's state within an atom","They determine the atomic number","They identify isotopes"],a:1,e:"The four quantum numbers uniquely describe an electron."},

{q:"Which statement best summarizes the Quantum Mechanical Model?",c:["Electrons move in fixed circular orbits","Electrons occupy regions of probability called orbitals","Electrons remain stationary around the nucleus","Electrons exist only in energy levels"],a:1,e:"The Quantum Mechanical Model describes electrons as probability distributions within orbitals."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
