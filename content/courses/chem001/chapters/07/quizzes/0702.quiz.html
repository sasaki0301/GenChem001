<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Applying the Trends in Atomic Properties</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Applying the Trends in Atomic Properties - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"Which periodic trend generally decreases from left to right across a period?",c:["Ionization energy","Electronegativity","Atomic radius","Electron affinity"],a:2,e:"Atomic radius decreases across a period because increasing nuclear charge pulls electrons closer."},

{q:"Which periodic trend generally increases from left to right across a period?",c:["Atomic radius","Metallic character","Ionization energy","Shielding effect"],a:2,e:"Ionization energy increases because electrons are held more tightly by the nucleus."},

{q:"Why does atomic radius decrease across a period?",c:["Additional energy levels are added","Electron shielding increases","Nuclear charge increases while electrons remain in the same energy level","Atoms lose protons"],a:2,e:"Increasing nuclear charge pulls electrons closer to the nucleus."},

{q:"Why does atomic radius increase down a group?",c:["Nuclear charge decreases","Additional energy levels are added","Valence electrons disappear","Electrons become positively charged"],a:1,e:"Each step down a group adds another occupied energy level."},

{q:"Which element has the largest atomic radius?",c:["Li","Na","K","Rb"],a:3,e:"Atomic radius increases down Group 1."},

{q:"Which element has the smallest atomic radius?",c:["Na","Mg","Cl","Al"],a:2,e:"Atomic radius decreases across a period, making Cl the smallest among these."},

{q:"Arrange the following in order of increasing atomic radius: Cl, Mg, Na.",c:["Na < Mg < Cl","Cl < Mg < Na","Mg < Cl < Na","Cl < Na < Mg"],a:1,e:"Atomic radius decreases from left to right across Period 3."},

{q:"What happens to the size of an atom when it forms a cation?",c:["It becomes larger","It becomes smaller","It remains unchanged","It doubles in size"],a:1,e:"Cations lose electrons and often lose an outer energy level."},

{q:"What happens to the size of an atom when it forms an anion?",c:["It becomes smaller","It becomes larger","It becomes neutral","It loses protons"],a:1,e:"Additional electrons increase electron-electron repulsion."},

{q:"Which species is larger?",c:["Na⁺","Na","Same size","Cannot be determined"],a:1,e:"The neutral atom is larger than its cation."},

{q:"Which species is larger?",c:["Cl","Cl⁻","Same size","Cannot be determined"],a:1,e:"The chloride ion is larger due to the added electron."},

{q:"Ionization energy is best defined as:",c:["The energy released when an electron is gained","The energy required to remove an electron","The attraction between atoms","The energy stored in chemical bonds"],a:1,e:"Ionization energy measures how difficult it is to remove an electron."},

{q:"Which element has the highest ionization energy?",c:["Li","Na","K","Rb"],a:0,e:"Ionization energy decreases down a group."},

{q:"Which element has the highest ionization energy among these Period 3 elements?",c:["Na","Mg","Al","Cl"],a:3,e:"Ionization energy generally increases across a period."},

{q:"Why does ionization energy generally increase across a period?",c:["Atomic radius increases","Nuclear attraction increases","Shielding increases dramatically","Atoms gain neutrons"],a:1,e:"Electrons are held more tightly by the increasingly positive nucleus."},

{q:"Why does ionization energy decrease down a group?",c:["Atoms become smaller","Valence electrons move farther from the nucleus","Nuclear charge disappears","Electrons are removed"],a:1,e:"Greater distance and shielding reduce nuclear attraction."},

{q:"Electron affinity describes an atom's tendency to:",c:["Lose protons","Gain electrons","Lose neutrons","Gain energy levels"],a:1,e:"Electron affinity measures how strongly an atom attracts additional electrons."},

{q:"Which family generally has the highest electron affinities?",c:["Alkali metals","Alkaline earth metals","Halogens","Noble gases"],a:2,e:"Halogens need only one electron to complete their valence shell."},

{q:"Electronegativity is defined as:",c:["The size of an atom","The ability of an atom to attract shared electrons","The energy needed to remove an electron","The tendency to lose protons"],a:1,e:"Electronegativity measures attraction for bonding electrons."},

{q:"Which element has the highest electronegativity in the periodic table?",c:["Oxygen","Nitrogen","Chlorine","Fluorine"],a:3,e:"Fluorine is the most electronegative element."},

{q:"Electronegativity generally ______ across a period and ______ down a group.",c:["Decreases, increases","Increases, decreases","Increases, increases","Decreases, decreases"],a:1,e:"This trend mirrors increasing nuclear attraction across periods."},

{q:"Which element has the greatest electronegativity?",c:["Li","Na","F","K"],a:2,e:"Fluorine has the highest electronegativity."},

{q:"Metallic character generally increases in which direction?",c:["Up a group","Across a period to the right","Down a group","Toward fluorine"],a:2,e:"Atoms more readily lose electrons lower in a group."},

{q:"Which region of the periodic table contains the most metallic elements?",c:["Upper right","Lower left","Center only","Upper left"],a:1,e:"Metallic character increases toward the lower-left corner."},

{q:"Which element has the strongest metallic character?",c:["Li","Na","K","Cl"],a:2,e:"Potassium is farther down Group 1 and more metallic."},

{q:"Which element is expected to lose an electron most easily?",c:["F","Cl","Na","Ne"],a:2,e:"Sodium has relatively low ionization energy."},

{q:"Which element is expected to gain an electron most readily?",c:["Na","Mg","Cl","Al"],a:2,e:"Chlorine has high electron affinity."},

{q:"Which alkali metal is expected to be the most reactive?",c:["Li","Na","K","Rb"],a:3,e:"Reactivity increases down Group 1 as ionization energy decreases."},

{q:"Which halogen is expected to be the most reactive?",c:["F","Cl","Br","I"],a:0,e:"Halogen reactivity decreases down the group."},

{q:"A student claims that fluorine is highly reactive because it has a large atomic radius. Why is this incorrect?",c:["Fluorine is a metal","Fluorine actually has a small atomic radius and strong attraction for electrons","Fluorine has no valence electrons","Fluorine has low electronegativity"],a:1,e:"Its small size and high electronegativity make fluorine extremely reactive."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
