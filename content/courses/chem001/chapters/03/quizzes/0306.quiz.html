<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chapter 3 Assessment: Chemical Quantities (Mole Concept)</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Chapter 3 Assessment: Chemical Quantities (Mole Concept)</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"What is the SI unit used to measure the amount of substance?",c:["Gram","Mole","Liter","Atom"],a:1,e:"The mole is the SI unit for amount of substance."},

{q:"One mole contains how many representative particles?",c:["6.022 × 10²²","6.022 × 10²³","1.000 × 10²³","3.011 × 10²³"],a:1,e:"Avogadro's number is 6.022 × 10²³ particles per mole."},

{q:"Which quantity is represented by Avogadro's number?",c:["Mass","Volume","Number of particles","Density"],a:2,e:"Avogadro's number represents the number of particles in one mole."},

{q:"How many particles are present in 2.00 mol of helium?",c:["6.022 × 10²³","1.204 × 10²⁴","3.011 × 10²³","2.408 × 10²⁴"],a:1,e:"2.00 × 6.022 × 10²³ = 1.204 × 10²⁴ particles."},

{q:"How many moles are represented by 3.011 × 10²³ particles?",c:["0.25 mol","0.50 mol","1.00 mol","2.00 mol"],a:1,e:"3.011 × 10²³ ÷ 6.022 × 10²³ = 0.50 mol."},

{q:"What type of particles are counted in one mole of NaCl?",c:["Atoms","Molecules","Formula units","Electrons"],a:2,e:"NaCl is an ionic compound, so its representative particles are formula units."},

{q:"What type of particles are counted in one mole of CO₂?",c:["Atoms","Molecules","Formula units","Ions"],a:1,e:"CO₂ is a molecular compound, so its representative particles are molecules."},

{q:"What is the molar mass of carbon?",c:["6.01 g/mol","12.01 g/mol","14.01 g/mol","16.00 g/mol"],a:1,e:"The molar mass of carbon is 12.01 g/mol."},

{q:"What is the molar mass of O₂?",c:["16.00 g/mol","18.00 g/mol","32.00 g/mol","34.00 g/mol"],a:2,e:"O₂ contains two oxygen atoms."},

{q:"What is the molar mass of H₂O?",c:["17.01 g/mol","18.02 g/mol","20.02 g/mol","32.00 g/mol"],a:1,e:"H₂O = (2 × 1.01) + 16.00 = 18.02 g/mol."},

{q:"Which equation is used to calculate moles from mass?",c:["m = n × M","n = m ÷ M","M = n ÷ m","n = M ÷ m"],a:1,e:"Moles equal mass divided by molar mass."},

{q:"How many moles are present in 24.0 g of carbon?",c:["1.00 mol","2.00 mol","3.00 mol","4.00 mol"],a:1,e:"24.0 ÷ 12.01 ≈ 2.00 mol."},

{q:"How many grams are present in 2.00 mol of H₂O?",c:["18.02 g","20.00 g","36.04 g","40.00 g"],a:2,e:"Mass = 2.00 × 18.02 = 36.04 g."},

{q:"How many moles are present in 48.0 g of O₂?",c:["0.50 mol","1.00 mol","1.50 mol","2.00 mol"],a:2,e:"48.0 ÷ 32.00 = 1.50 mol."},

{q:"Which sample contains more moles?",c:["10 g carbon","10 g sodium","Both equal","Cannot be determined"],a:0,e:"Carbon has a lower molar mass, so the same mass contains more moles."},

{q:"How many atoms are present in one molecule of NH₃?",c:["3","4","5","6"],a:1,e:"NH₃ contains 1 nitrogen and 3 hydrogen atoms."},

{q:"How many total atoms are present in one molecule of C₆H₁₂O₆?",c:["18","20","24","30"],a:2,e:"6 + 12 + 6 = 24 atoms."},

{q:"How many oxygen atoms are present in one molecule of CO₂?",c:["1","2","3","4"],a:1,e:"The subscript 2 indicates two oxygen atoms."},

{q:"How many hydrogen atoms are present in 1 mol of H₂O?",c:["6.022 × 10²³","1.204 × 10²⁴","3.011 × 10²³","2.408 × 10²⁴"],a:1,e:"Each water molecule contains two hydrogen atoms."},

{q:"How many formula units are present in 3.00 mol of NaCl?",c:["6.022 × 10²³","1.204 × 10²⁴","1.807 × 10²⁴","2.408 × 10²⁴"],a:2,e:"3.00 × 6.022 × 10²³ = 1.807 × 10²⁴."},

{q:"What does an empirical formula represent?",c:["Actual number of atoms","Simplest whole-number ratio","Molecular mass","Percent composition"],a:1,e:"Empirical formulas show the simplest atom ratio."},

{q:"What does a molecular formula represent?",c:["Actual number of atoms","Simplest ratio","Percent composition","Atomic mass"],a:0,e:"Molecular formulas show the actual number of atoms present."},

{q:"What is the empirical formula of C₂H₄?",c:["CH","CH₂","C₂H₄","C₄H₈"],a:1,e:"Divide both subscripts by 2."},

{q:"What is the empirical formula of N₂O₄?",c:["NO","NO₂","N₂O","N₂O₄"],a:1,e:"Divide both subscripts by 2."},

{q:"A compound has empirical formula CH₂ and molecular formula C₆H₁₂. What is n?",c:["2","3","4","6"],a:3,e:"Each subscript was multiplied by 6."},

{q:"If the empirical formula is CH₂O and n = 6, what is the molecular formula?",c:["C₃H₆O₃","C₆H₁₂O₆","CH₂O","C₁₂H₂₄O₁₂"],a:1,e:"Multiply all subscripts by 6."},

{q:"Why is a 100 g sample commonly assumed in percent composition problems?",c:["To simplify calculations","To increase accuracy","To determine molar mass","To avoid using moles"],a:0,e:"Percent values become equivalent gram values."},

{q:"What is the first step after assuming a 100 g sample?",c:["Determine molecular mass","Convert grams to moles","Write the formula","Divide by smallest value"],a:1,e:"Empirical formulas are based on mole ratios."},

{q:"What is the molar mass of CO₂?",c:["28.01 g/mol","32.00 g/mol","40.01 g/mol","44.01 g/mol"],a:3,e:"12.01 + (2 × 16.00) = 44.01 g/mol."},

{q:"What is percent composition?",c:["Percentage by mass of each element","Number of atoms","Number of moles","Mass of one mole"],a:0,e:"Percent composition describes how much of a compound's mass comes from each element."},

{q:"Which formula is used for percent composition?",c:["(Element Mass ÷ Compound Molar Mass) × 100","(Compound Mass ÷ Element Mass) × 100","Mass × Moles","Moles ÷ Mass"],a:0,e:"This formula determines the percentage contribution of an element."},

{q:"Approximately what percentage of water's mass comes from oxygen?",c:["11%","22%","50%","89%"],a:3,e:"Oxygen contributes approximately 88.8% of water's mass."},

{q:"Why does oxygen contribute more mass than hydrogen in water?",c:["More oxygen atoms","Oxygen atoms are heavier","Hydrogen disappears","Water is polar"],a:1,e:"Atomic mass determines mass contribution."},

{q:"Which statement about percent composition is TRUE?",c:["It depends on sample size","It changes with the number of moles","Percentages total approximately 100%","It only applies to molecular compounds"],a:2,e:"The percentages of all elements should add to approximately 100%."},

{q:"Which statement best summarizes Chapter 3?",c:["Chemistry only studies atoms","Moles connect particle counts, mass, formulas, and composition","Molar mass and molecular mass are unrelated","Chemical formulas cannot be derived experimentally"],a:1,e:"Chapter 3 focuses on connecting quantities, particles, formulas, and composition through the mole concept."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
