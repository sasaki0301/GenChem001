<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Differentiating Polar and Nonpolar Compounds</title>

<style>
body{
  font-family:"Segoe UI",Arial,sans-serif;
  background:#fafafa;
  color:#222;
  padding:24px;
  line-height:1.8;
  font-size:20px;
}

h1{color:#136f63;}
h2{color:#136f63;margin-top:1.4em;}
h3{color:#174ea6;}

.section{margin-bottom:30px;}

.key-box{
  background:#e8f7f5;
  border-left:6px solid #136f63;
  padding:14px;
  border-radius:8px;
  margin:16px 0;
}

.example-box{
  background:#fff;
  border-left:5px solid #2b7de9;
  padding:14px;
  border-radius:8px;
  margin:16px 0;
}

.visual-box{
  background:#fff;
  border-radius:12px;
  padding:14px;
  margin:16px 0;
  border:1px solid #ddd;
}

.lesson-img{
  width:100%;
  max-width:720px;
  display:block;
  margin:0 auto;
  border-radius:12px;
}

.caption{
  text-align:center;
  font-size:0.9em;
  color:#555;
}

.activity{
  background:#fff;
  padding:14px;
  border-radius:10px;
  margin:14px 0;
}

.toggle-btn{
  background:#136f63;
  color:white;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

.answer{
  display:none;
  margin-top:10px;
  background:#eef3ff;
  padding:10px;
  border-radius:6px;
}

.formula{
  font-size:22px;
  font-weight:bold;
  text-align:center;
}

.formula .equation-line{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:8px 0;
}

.formula .fraction{
  display:inline-grid;
  grid-template-rows:auto auto;
  min-width:max-content;
  text-align:center;
  line-height:1.2;
  vertical-align:middle;
}

.formula .fraction-top{
  border-bottom:2px solid currentColor;
  padding:0 10px 5px;
}

.formula .fraction-bottom{
  padding:5px 10px 0;
}

.answer .formula{
  font-size:20px;
  margin:8px 0;
}

.answer ol{
  margin-top:8px;
}

.quiz-button{
  background:#136f63;
  color:white;
  padding:12px 22px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
  margin:16px 0;
  background:#fff;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
}

th{background:#e8f7f5;}

iframe{
  width:100%;
  max-width:100%;
}
</style>
</head>
<body>

<div style="text-align:center;margin-top:30px;">
	<button class="quiz-button" id="takeQuizBtn">

Take the Quiz →

</button>

</div>

<script>
function toggleAnswer(btn){
  const ans = btn.nextElementSibling;
  ans.style.display = ans.style.display === "block" ? "none" : "block";
}

document.getElementById("takeQuizBtn").addEventListener("click",(e)=>{
  const quizId = e.target.dataset.quiz;
  window.parent.postMessage({
    type:"openQuiz",
    quiz:quizId
  },"*");
});
</script>
</body>
</html>
