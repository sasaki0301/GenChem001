<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Recognizing How an Ionic Bond and Covalent Bond are Formed</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Recognizing How an Ionic Bond and Covalent Bond are Formed - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"Why do most atoms form chemical bonds?",c:["To increase their atomic mass","To become radioactive","To achieve a more stable electron configuration","To gain additional protons"],a:2,e:"Atoms form chemical bonds to achieve a lower-energy, more stable electron configuration, often by satisfying the octet rule."},

{q:"According to the Octet Rule, atoms tend to:",c:["Have eight protons","Gain, lose, or share electrons to obtain eight valence electrons","Form only ionic bonds","Always gain electrons"],a:1,e:"The Octet Rule states that atoms tend to gain, lose, or share electrons to complete eight valence electrons."},

{q:"Which pair of elements is most likely to form an ionic bond?",c:["Carbon and Oxygen","Hydrogen and Chlorine","Magnesium and Fluorine","Nitrogen and Hydrogen"],a:2,e:"Ionic bonds generally form between metals and nonmetals. Magnesium is a metal while fluorine is a nonmetal."},

{q:"Which pair of elements is most likely to form a covalent bond?",c:["Potassium and Bromine","Calcium and Oxygen","Phosphorus and Chlorine","Lithium and Sulfur"],a:2,e:"Covalent bonds form primarily between nonmetals."},

{q:"Which process best describes ionic bond formation?",c:["Sharing electrons equally","Sharing electrons unequally","Transfer of electrons between atoms","Transfer of protons"],a:2,e:"Ionic bonding involves the transfer of electrons from one atom to another."},

{q:"Which process best describes covalent bond formation?",c:["Electron transfer","Sharing of electron pairs","Loss of neutrons","Gain of protons"],a:1,e:"Covalent bonds are formed when atoms share electrons."},

{q:"Which particle is produced when sodium loses one electron?",c:["Na⁻","Na²⁺","Na⁺","Na²⁻"],a:2,e:"Loss of one electron produces a +1 cation."},

{q:"What ion forms when oxygen gains two electrons?",c:["O⁺","O²⁺","O²⁻","O⁻"],a:2,e:"Oxygen gains two electrons to complete its octet."},

{q:"Which statement correctly describes cations?",c:["They gain electrons","They are negatively charged","They lose electrons and become positively charged","They only exist in covalent compounds"],a:2,e:"Cations form when atoms lose electrons."},

{q:"Which statement correctly describes anions?",c:["They lose electrons","They gain electrons and become negatively charged","They are always metals","They contain fewer electrons than protons"],a:1,e:"Anions are negatively charged ions formed by gaining electrons."},

{q:"Which compound is composed of ions held together by electrostatic attraction?",c:["CH₄","NH₃","NaF","CO₂"],a:2,e:"NaF is an ionic compound composed of Na⁺ and F⁻ ions."},

{q:"Which property is typical of ionic compounds?",c:["Poor electrical conductivity in solution","Low melting point","Conduct electricity when molten or dissolved","Exist only as gases"],a:2,e:"Mobile ions allow molten or aqueous ionic compounds to conduct electricity."},

{q:"Which property is typical of most covalent compounds?",c:["High electrical conductivity","Composed of ions","Poor electrical conductivity","Always solid at room temperature"],a:2,e:"Covalent compounds generally do not contain mobile charged particles."},

{q:"Which type of bond exists in the chlorine molecule (Cl₂)?",c:["Ionic","Single covalent","Double covalent","Triple covalent"],a:1,e:"Each chlorine atom shares one electron, forming a single covalent bond."},

{q:"How many electron pairs are shared in a double bond?",c:["One","Two","Three","Four"],a:1,e:"A double bond consists of two shared electron pairs."},

{q:"Which molecule contains a triple bond?",c:["O₂","CO₂","N₂","H₂"],a:2,e:"Nitrogen atoms share three pairs of electrons."},

{q:"Which molecule contains two double bonds?",c:["CH₄","NH₃","CO₂","H₂O"],a:2,e:"Carbon dioxide contains two C=O double bonds."},

{q:"Why is magnesium oxide (MgO) classified as an ionic compound?",c:["Both atoms are nonmetals","Electrons are shared equally","Magnesium transfers electrons to oxygen","It contains double bonds"],a:2,e:"Magnesium loses two electrons while oxygen gains two."},

{q:"Which compound is formed when aluminum reacts with chlorine?",c:["AlCl","Al₂Cl","AlCl₃","Al₃Cl₂"],a:2,e:"Aluminum commonly forms Al³⁺ while chlorine forms Cl⁻."},

{q:"Which element is most likely to lose two electrons during bonding?",c:["Sodium","Magnesium","Chlorine","Oxygen"],a:1,e:"Magnesium belongs to Group 2 and forms Mg²⁺."},

{q:"Which element is most likely to gain one electron during bonding?",c:["Potassium","Calcium","Fluorine","Magnesium"],a:2,e:"Fluorine has seven valence electrons and needs one more."},

{q:"Which statement correctly compares ionic and covalent compounds?",c:["Both involve electron transfer","Ionic compounds involve electron transfer while covalent compounds involve electron sharing","Covalent compounds contain only metals","Ionic compounds contain only nonmetals"],a:1,e:"Electron transfer distinguishes ionic bonding from covalent bonding."},

{q:"Which compound contains only covalent bonds?",c:["KBr","Na₂O","CH₃OH","MgCl₂"],a:2,e:"Methanol consists entirely of nonmetals bonded covalently."},

{q:"A bond formed by sharing three electron pairs is called:",c:["Single bond","Double bond","Triple bond","Coordinate bond"],a:2,e:"Triple bonds contain three shared electron pairs."},

{q:"Which substance is expected to have the highest melting point?",c:["CO₂","CH₄","NaCl","NH₃"],a:2,e:"Strong electrostatic attractions give ionic compounds high melting points."},

{q:"Why is diamond extremely hard?",c:["It contains ionic bonds","It consists of a giant covalent network","It contains metallic bonds","It has many lone pairs"],a:1,e:"Diamond is a three-dimensional network of strong covalent bonds."},

{q:"Which statement best explains why sugar does not conduct electricity in solution?",c:["It has no atoms","It remains as neutral molecules in solution","It contains metals","It forms ions only at high temperatures"],a:1,e:"Sugar dissolves as molecules rather than ions."},

{q:"Which compound is most likely to conduct electricity when dissolved in water?",c:["CH₄","CO₂","KNO₃","CCl₄"],a:2,e:"Potassium nitrate dissociates into K⁺ and NO₃⁻ ions."},

{q:"An atom with one valence electron is most likely to:",c:["Gain seven electrons","Lose one electron","Share four electrons","Gain two electrons"],a:1,e:"Group 1 elements become stable by losing one electron."},

{q:"A chemist discovers a compound made from a metal and a nonmetal that has a high melting point and conducts electricity when molten. Which type of bonding is most likely present?",c:["Metallic bonding","Hydrogen bonding","Covalent bonding","Ionic bonding"],a:3,e:"These are classic properties of ionic compounds."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
