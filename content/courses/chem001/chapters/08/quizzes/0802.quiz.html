<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lewis Structures and VSEPR Theory</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Lewis Structures and VSEPR Theory - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"What information is represented by a Lewis dot symbol?",c:["All electrons in an atom","Only the nucleus","Only the valence electrons","The atomic mass"],a:2,e:"Lewis dot symbols represent only the valence electrons that participate in bonding."},

{q:"What is the primary purpose of a Lewis structure?",c:["To determine atomic mass","To show bonding pairs and lone pairs of electrons","To calculate molar mass","To identify isotopes"],a:1,e:"Lewis structures illustrate how atoms are connected and where valence electrons are located."},

{q:"Which step should be performed first when drawing a Lewis structure?",c:["Draw the central atom","Determine molecular geometry","Count the total number of valence electrons","Add lone pairs"],a:2,e:"Always begin by counting the total number of valence electrons."},

{q:"Which atom is usually chosen as the central atom in a Lewis structure?",c:["Hydrogen","The least electronegative atom (excluding hydrogen)","The most electronegative atom","The atom with the highest atomic mass"],a:1,e:"The least electronegative atom is usually placed in the center."},

{q:"Hydrogen usually forms how many covalent bonds?",c:["1","2","3","4"],a:0,e:"Hydrogen follows the duet rule and forms only one bond."},

{q:"Carbon typically forms how many covalent bonds?",c:["2","3","4","5"],a:2,e:"Carbon usually forms four covalent bonds to complete its octet."},

{q:"How many valence electrons does nitrogen contribute when drawing Lewis structures?",c:["3","4","5","6"],a:2,e:"Nitrogen belongs to Group 15 and has five valence electrons."},

{q:"What is a bonding pair?",c:["A pair of protons","A pair of electrons shared between atoms","Two lone electrons","A pair of neutrons"],a:1,e:"Bonding pairs are shared electron pairs that form covalent bonds."},

{q:"What is a lone pair?",c:["Electrons shared by two atoms","A pair of electrons belonging to only one atom","A proton pair","A pair of ions"],a:1,e:"Lone pairs are nonbonding electron pairs located on one atom."},

{q:"Which molecule contains two lone pairs on its central atom?",c:["CH₄","NH₃","H₂O","CO₂"],a:2,e:"Oxygen in water has two lone pairs."},

{q:"Which molecule contains one lone pair on its central atom?",c:["CH₄","NH₃","CO₂","BF₃"],a:1,e:"Nitrogen in ammonia has one lone pair."},

{q:"Which molecule contains no lone pairs on its central atom?",c:["CH₄","NH₃","H₂O","PCl₃"],a:0,e:"Carbon in methane forms four bonds and has no lone pairs."},

{q:"A double bond contains how many shared electron pairs?",c:["1","2","3","4"],a:1,e:"A double bond consists of two shared electron pairs."},

{q:"A triple bond contains how many shared electron pairs?",c:["1","2","3","4"],a:2,e:"A triple bond consists of three shared electron pairs."},

{q:"Which molecule contains a triple bond?",c:["CO₂","HCN","H₂O","CH₄"],a:1,e:"Hydrogen cyanide contains a carbon-nitrogen triple bond."},

{q:"Which molecule is an example of an incomplete octet?",c:["CH₄","BF₃","CO₂","NH₃"],a:1,e:"Boron in BF₃ has only six valence electrons."},

{q:"Which statement best describes VSEPR Theory?",c:["Electrons attract one another","Electron pairs repel one another and arrange themselves as far apart as possible","Atoms always form ionic bonds","All molecules are linear"],a:1,e:"VSEPR explains molecular shape based on electron-pair repulsion."},

{q:"Which molecular geometry is expected for BeCl₂?",c:["Bent","Linear","Trigonal pyramidal","Tetrahedral"],a:1,e:"Two electron groups around Be produce a linear geometry."},

{q:"Which molecular geometry is expected for BF₃?",c:["Bent","Linear","Trigonal planar","Tetrahedral"],a:2,e:"Three bonding groups and no lone pairs produce a trigonal planar geometry."},

{q:"Which molecular geometry is expected for CH₄?",c:["Trigonal planar","Bent","Tetrahedral","Linear"],a:2,e:"Four bonding groups around carbon produce a tetrahedral shape."},

{q:"Which molecular geometry is expected for NH₃?",c:["Linear","Trigonal planar","Trigonal pyramidal","Bent"],a:2,e:"Three bonds and one lone pair produce a trigonal pyramidal geometry."},

{q:"Which molecular geometry is expected for H₂O?",c:["Bent","Linear","Trigonal planar","Tetrahedral"],a:0,e:"Two bonding pairs and two lone pairs produce a bent shape."},

{q:"What is the approximate bond angle in a tetrahedral molecule?",c:["90°","104.5°","109.5°","120°"],a:2,e:"The ideal tetrahedral bond angle is approximately 109.5°."},

{q:"Which molecule has an ideal bond angle of 120°?",c:["CH₄","BF₃","CO₂","NH₃"],a:1,e:"Trigonal planar molecules have ideal bond angles of 120°."},

{q:"Which molecule has an ideal bond angle of 180°?",c:["CO₂","H₂O","NH₃","CH₄"],a:0,e:"Linear molecules have bond angles of 180°."},

{q:"Why is the bond angle in water smaller than the tetrahedral angle?",c:["Hydrogen atoms repel oxygen","Lone pairs repel bonding pairs more strongly","Water is ionic","Oxygen has no valence electrons"],a:1,e:"Lone pair repulsion compresses the H–O–H bond angle to about 104.5°."},

{q:"Which molecule has a trigonal pyramidal geometry because of one lone pair on the central atom?",c:["CH₄","NH₃","BF₃","CO₂"],a:1,e:"One lone pair changes the geometry from tetrahedral electron arrangement to trigonal pyramidal."},

{q:"A molecule has four electron groups and two lone pairs on the central atom. What is its molecular geometry?",c:["Linear","Bent","Trigonal planar","Tetrahedral"],a:1,e:"Four electron groups with two lone pairs produce a bent molecular geometry."},

{q:"A molecule has three bonding groups and no lone pairs around the central atom. What geometry is expected?",c:["Bent","Trigonal planar","Linear","Trigonal pyramidal"],a:1,e:"Three electron groups produce a trigonal planar geometry."},

{q:"A chemist determines that the central atom of an unknown molecule has two bonding groups and no lone pairs. Based on VSEPR Theory, what is the most likely molecular geometry?",c:["Bent","Trigonal planar","Linear","Tetrahedral"],a:2,e:"Two electron groups arrange themselves opposite each other, producing a linear geometry."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
