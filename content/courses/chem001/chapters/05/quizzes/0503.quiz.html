<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Combined Gas Law and Ideal Gas Law</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>The Combined Gas Law and Ideal Gas Law - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"Which gas law should be used when pressure, volume, and temperature change while the amount of gas remains constant?",c:["Boyle's Law","Charles's Law","Combined Gas Law","Ideal Gas Law"],a:2,e:"The Combined Gas Law relates pressure, volume, and temperature when the number of moles remains constant."},

{q:"Which equation represents the Combined Gas Law?",c:["PV = nRT","P₁V₁ = P₂V₂","V₁/T₁ = V₂/T₂","(P₁V₁)/T₁ = (P₂V₂)/T₂"],a:3,e:"The Combined Gas Law combines Boyle's, Charles's, and Gay-Lussac's Laws."},

{q:"Which equation represents the Ideal Gas Law?",c:["P₁V₁ = P₂V₂","PV = nRT","V₁/T₁ = V₂/T₂","P₁/T₁ = P₂/T₂"],a:1,e:"The Ideal Gas Law relates pressure, volume, moles, and temperature."},

{q:"In the equation PV = nRT, what does the symbol n represent?",c:["Pressure","Temperature","Gas constant","Number of moles"],a:3,e:"n represents the amount of gas measured in moles."},

{q:"In the equation PV = nRT, what does the symbol R represent?",c:["Reaction constant","Rate constant","Gas constant","Relative pressure"],a:2,e:"R is the universal gas constant."},

{q:"Which value of R is most commonly used when pressure is expressed in atmospheres?",c:["8.314 L·kPa/mol·K","0.0821 L·atm/mol·K","22.4 L/mol","1.00 atm"],a:1,e:"0.0821 L·atm/mol·K is used when pressure is measured in atmospheres."},

{q:"Why must temperature always be expressed in Kelvin when using the Combined Gas Law or Ideal Gas Law?",c:["Kelvin measures pressure","Kelvin is an absolute temperature scale","Kelvin values are easier to calculate","Gas laws only work above 0°C"],a:1,e:"Gas laws require absolute temperature values."},

{q:"What are the standard conditions of STP?",c:["273 K and 1 atm","298 K and 1 atm","273 K and 100 kPa","300 K and 1 atm"],a:0,e:"STP is defined as 273 K and 1 atm."},

{q:"At STP, one mole of an ideal gas occupies approximately:",c:["11.2 L","22.4 L","44.8 L","24.5 L"],a:1,e:"One mole of an ideal gas occupies approximately 22.4 L at STP."},

{q:"Which variable remains constant when using the Combined Gas Law?",c:["Pressure","Volume","Temperature","Number of moles"],a:3,e:"The Combined Gas Law assumes a constant amount of gas."},

{q:"A gas occupies 2.00 L at 1.00 atm and 300 K. What volume will it occupy at 2.00 atm and 300 K?",c:["0.50 L","1.00 L","2.00 L","4.00 L"],a:1,e:"Using Boyle's Law or the Combined Gas Law, doubling pressure halves volume."},

{q:"A gas occupies 4.00 L at 300 K. What volume will it occupy at 600 K if pressure remains constant?",c:["2.00 L","4.00 L","6.00 L","8.00 L"],a:3,e:"Doubling Kelvin temperature doubles volume."},

{q:"Using PV = nRT, what happens to pressure if volume decreases while all other variables remain constant?",c:["Pressure decreases","Pressure increases","Pressure remains constant","Pressure becomes zero"],a:1,e:"Pressure and volume are inversely related."},

{q:"What is the pressure of 1.00 mol of gas occupying 10.0 L at 273 K? (R = 0.0821 L·atm/mol·K)",c:["1.12 atm","2.24 atm","3.36 atm","4.48 atm"],a:1,e:"P=(1.00×0.0821×273)/10.0 ≈ 2.24 atm."},

{q:"What volume will 2.00 mol of gas occupy at STP?",c:["11.2 L","22.4 L","33.6 L","44.8 L"],a:3,e:"2.00 mol × 22.4 L/mol = 44.8 L."},

{q:"A gas occupies 5.00 L at 300 K and 1.00 atm. What volume will it occupy at 450 K and 1.00 atm?",c:["3.33 L","5.00 L","7.50 L","10.0 L"],a:2,e:"V₂=(5.00×450)/300 = 7.50 L."},

{q:"Which law would be most appropriate if pressure, volume, temperature, and moles are all involved in the problem?",c:["Boyle's Law","Charles's Law","Combined Gas Law","Ideal Gas Law"],a:3,e:"The Ideal Gas Law incorporates all four gas variables."},

{q:"A gas sample has a pressure of 2.00 atm and a volume of 4.00 L. What is the value of PV?",c:["2.00 atm·L","4.00 atm·L","6.00 atm·L","8.00 atm·L"],a:3,e:"PV = 2.00 × 4.00 = 8.00 atm·L."},

{q:"A weather balloon rises into the atmosphere where pressure decreases and volume increases. Which gas law relationship is most directly observed?",c:["Pressure and volume inverse relationship","Pressure and temperature direct relationship","Volume and moles direct relationship","Temperature and moles inverse relationship"],a:0,e:"As pressure decreases, volume tends to increase."},

{q:"Which statement best distinguishes the Ideal Gas Law from the Combined Gas Law?",c:["The Combined Gas Law includes moles","The Ideal Gas Law includes moles as a variable","The Ideal Gas Law does not use temperature","The Combined Gas Law applies only at STP"],a:1,e:"The Ideal Gas Law includes the amount of gas (n), while the Combined Gas Law assumes n remains constant."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
