<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Describing the Properties of Gases</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Describing the Properties of Gases - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"Which property best explains why a gas expands to fill its entire container?",c:["High density","Constant random particle motion","Strong intermolecular forces","Fixed particle positions"],a:1,e:"Gas particles move continuously and randomly, causing them to spread throughout the available space."},

{q:"Why are gases much more compressible than liquids?",c:["Gas particles are larger","Gas particles have greater mass","Large empty spaces exist between gas particles","Gas particles stop moving when compressed"],a:2,e:"Most of the volume of a gas consists of empty space between particles."},

{q:"Which state of matter has neither a definite shape nor a definite volume?",c:["Solid","Liquid","Gas","Plasma"],a:2,e:"Gases take both the shape and volume of their containers."},

{q:"According to the Kinetic Molecular Theory, gas particles are in:",c:["Circular motion","Constant random motion","Stationary vibration only","Uniform motion in one direction"],a:1,e:"Gas particles move randomly in all directions."},

{q:"What causes gas pressure inside a container?",c:["Gravity acting on the gas","Mass of the container","Collisions of gas particles with container walls","Intermolecular attractions"],a:2,e:"Pressure results from collisions between gas particles and the walls of the container."},

{q:"Which statement is a major assumption of the Kinetic Molecular Theory?",c:["Gas particles occupy most of the container volume","Gas particles experience strong attractions","Gas particles move in constant random motion","Gas particles eventually stop moving"],a:2,e:"Continuous random motion is one of the central assumptions of KMT."},

{q:"What is meant by an elastic collision?",c:["Particles stick together after collision","Energy is lost as heat","Total kinetic energy is conserved","Particles become larger"],a:2,e:"Elastic collisions conserve total kinetic energy."},

{q:"According to KMT, the average kinetic energy of gas particles depends primarily on:",c:["Pressure","Volume","Temperature","Density"],a:2,e:"Temperature directly affects average kinetic energy."},

{q:"When the temperature of a gas increases, what happens to the average kinetic energy of its particles?",c:["Decreases","Remains constant","Increases","Becomes zero"],a:2,e:"Higher temperatures correspond to higher average kinetic energies."},

{q:"Which property explains why the smell of perfume spreads throughout a room?",c:["Effusion","Compression","Diffusion","Condensation"],a:2,e:"Diffusion is the spontaneous mixing of particles."},

{q:"What is diffusion?",c:["Movement through a tiny hole","Mixing caused by random particle motion","Gas compression","Gas expansion under pressure"],a:1,e:"Diffusion is the mixing of particles due to their random motion."},

{q:"What is effusion?",c:["Mixing of gases","Escape of gas through a tiny opening","Compression of gas","Cooling of gas"],a:1,e:"Effusion involves gas particles passing through a small opening."},

{q:"Which example best demonstrates effusion?",c:["Perfume spreading through a room","A balloon inflating","Air slowly leaking from a tire","Steam rising from water"],a:2,e:"Leaking air escapes through tiny openings, illustrating effusion."},

{q:"Why do gases generally have lower densities than solids and liquids?",c:["Gas particles are smaller","Gas particles have less mass","Gas particles are farther apart","Gas particles do not move"],a:2,e:"The large spacing between gas particles results in low density."},

{q:"A hot-air balloon rises primarily because heating the air:",c:["Increases molecular mass","Decreases particle motion","Increases particle kinetic energy and expansion","Creates new gas particles"],a:2,e:"Heating increases kinetic energy, causing the gas to expand."},

{q:"Which factor would increase the pressure inside a sealed rigid container?",c:["Lowering temperature","Removing gas particles","Increasing temperature","Increasing volume"],a:2,e:"Higher temperature increases particle speed and collision frequency."},

{q:"According to KMT, gas particles occupy:",c:["Most of the volume of the container","Negligible volume compared to the container","Exactly half the container volume","Variable volume depending on pressure"],a:1,e:"Gas particles themselves occupy very little space compared to the container."},

{q:"Which statement best explains why gases fill any container completely?",c:["Gas particles attract the container walls","Gas particles are highly dense","Gas particles move freely and randomly","Gas particles expand in size"],a:2,e:"Continuous random motion allows gases to spread throughout the container."},

{q:"Why are attractive forces between ideal gas particles considered negligible?",c:["Particles move too slowly","Particles are extremely large","Particles are far apart most of the time","Particles are electrically neutral"],a:2,e:"The large distances between particles minimize attractive forces."},

{q:"Which statement best summarizes the Kinetic Molecular Theory?",c:["Gas behavior is governed primarily by particle motion","Gas particles remain stationary until heated","Gas particles occupy most of the container volume","Gas pressure depends only on particle mass"],a:0,e:"KMT explains gas properties through the motion and collisions of particles."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
