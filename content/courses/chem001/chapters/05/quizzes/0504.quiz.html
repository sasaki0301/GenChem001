<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chapter 5 Assessment: Gases</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Chapter 5 Assessment: Gases</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

const quizData = [

{q:"Which property allows gases to be compressed much more than liquids?",c:["High density","Strong intermolecular forces","Large empty spaces between particles","Large particle size"],a:2,e:"Gas particles are separated by large empty spaces, making gases highly compressible."},

{q:"Why do gases expand to fill their containers?",c:["They have high density","Particles are attracted to container walls","Particles move in constant random motion","Particles increase in size"],a:2,e:"Random particle motion causes gases to spread throughout the available space."},

{q:"What causes gas pressure inside a container?",c:["Gravity","Mass of the gas","Particle collisions with container walls","Intermolecular attractions"],a:2,e:"Pressure results from collisions of gas particles with the container walls."},

{q:"Which process describes the mixing of gases due to random particle motion?",c:["Effusion","Compression","Diffusion","Condensation"],a:2,e:"Diffusion is the spontaneous mixing of gas particles."},

{q:"Which process describes gas escaping through a tiny opening?",c:["Diffusion","Effusion","Expansion","Vaporization"],a:1,e:"Effusion occurs when gas passes through a small opening."},

{q:"According to Kinetic Molecular Theory, gas particles are in:",c:["Circular motion","Constant random motion","Stationary vibration","Uniform motion in one direction"],a:1,e:"Gas particles move continuously and randomly."},

{q:"According to Kinetic Molecular Theory, the average kinetic energy of gas particles depends on:",c:["Pressure","Volume","Temperature","Density"],a:2,e:"Temperature directly affects average kinetic energy."},

{q:"What happens to particle kinetic energy when temperature increases?",c:["Decreases","Remains constant","Increases","Becomes zero"],a:2,e:"Higher temperature means higher average kinetic energy."},

{q:"Which assumption of KMT states that collisions conserve kinetic energy?",c:["Negligible volume","Elastic collisions","Random motion","Minimal attractions"],a:1,e:"Elastic collisions conserve kinetic energy."},

{q:"Why do gases generally have low densities?",c:["Particles are very heavy","Particles are closely packed","Particles are widely spaced","Particles stop moving"],a:2,e:"Large spaces between particles produce low density."},

{q:"Which gas law describes the inverse relationship between pressure and volume?",c:["Charles's Law","Boyle's Law","Gay-Lussac's Law","Avogadro's Law"],a:1,e:"Boyle's Law states that pressure and volume are inversely proportional."},

{q:"According to Boyle's Law, if volume is reduced by half, pressure will:",c:["Decrease by half","Remain unchanged","Double","Quadruple"],a:2,e:"Pressure and volume are inversely proportional."},

{q:"Which gas law describes the direct relationship between volume and temperature?",c:["Boyle's Law","Charles's Law","Gay-Lussac's Law","Ideal Gas Law"],a:1,e:"Charles's Law states that volume and temperature are directly proportional."},

{q:"A gas occupies 3.0 L at 300 K. What volume will it occupy at 600 K if pressure remains constant?",c:["1.5 L","3.0 L","6.0 L","9.0 L"],a:2,e:"Doubling Kelvin temperature doubles volume."},

{q:"Which gas law describes the direct relationship between pressure and temperature?",c:["Boyle's Law","Charles's Law","Gay-Lussac's Law","Avogadro's Law"],a:2,e:"Gay-Lussac's Law relates pressure and temperature."},

{q:"A gas has a pressure of 1.5 atm at 300 K. What pressure will it have at 600 K if volume remains constant?",c:["0.75 atm","1.5 atm","2.25 atm","3.0 atm"],a:3,e:"Doubling temperature doubles pressure."},

{q:"Which gas law states that volume is directly proportional to the number of moles?",c:["Boyle's Law","Charles's Law","Gay-Lussac's Law","Avogadro's Law"],a:3,e:"Avogadro's Law relates volume and moles."},

{q:"If the number of moles of gas doubles while pressure and temperature remain constant, the volume will:",c:["Halve","Remain unchanged","Double","Quadruple"],a:2,e:"Volume and moles are directly proportional."},

{q:"What is the Kelvin equivalent of 25°C?",c:["248 K","273 K","298 K","325 K"],a:2,e:"25 + 273 = 298 K."},

{q:"Why must Kelvin be used in gas law calculations?",c:["Kelvin measures pressure","Kelvin is an absolute temperature scale","Kelvin is always larger","Gas laws require Celsius conversion"],a:1,e:"Gas laws are based on absolute temperature."},

{q:"Which gas law should be used when pressure, volume, and temperature all change but moles remain constant?",c:["Boyle's Law","Charles's Law","Combined Gas Law","Ideal Gas Law"],a:2,e:"The Combined Gas Law relates P, V, and T."},

{q:"Which equation represents the Combined Gas Law?",c:["PV=nRT","P₁V₁=P₂V₂","(P₁V₁)/T₁=(P₂V₂)/T₂","V₁/T₁=V₂/T₂"],a:2,e:"The Combined Gas Law combines Boyle's, Charles's, and Gay-Lussac's Laws."},

{q:"Which equation represents the Ideal Gas Law?",c:["PV=nRT","P₁V₁=P₂V₂","P/T=constant","V/n=constant"],a:0,e:"PV = nRT is the Ideal Gas Law."},

{q:"In PV = nRT, what does n represent?",c:["Pressure","Volume","Moles of gas","Gas constant"],a:2,e:"n represents the amount of gas in moles."},

{q:"In PV = nRT, what does R represent?",c:["Reaction constant","Gas constant","Rate constant","Relative pressure"],a:1,e:"R is the universal gas constant."},

{q:"Which value of R is commonly used when pressure is measured in atmospheres?",c:["8.314 L·kPa/mol·K","0.0821 L·atm/mol·K","22.4 L/mol","1.00 atm"],a:1,e:"0.0821 L·atm/mol·K is used with atmospheres."},

{q:"What are the standard conditions of STP?",c:["273 K and 1 atm","298 K and 1 atm","273 K and 100 kPa","300 K and 1 atm"],a:0,e:"STP is defined as 273 K and 1 atm."},

{q:"At STP, one mole of an ideal gas occupies approximately:",c:["11.2 L","22.4 L","24.5 L","44.8 L"],a:1,e:"One mole occupies approximately 22.4 L at STP."},

{q:"What volume will 3.0 mol of an ideal gas occupy at STP?",c:["22.4 L","44.8 L","67.2 L","89.6 L"],a:2,e:"3.0 × 22.4 = 67.2 L."},

{q:"A gas occupies 4.0 L at 1.0 atm and 300 K. What volume will it occupy at 2.0 atm and 300 K?",c:["1.0 L","2.0 L","4.0 L","8.0 L"],a:1,e:"Doubling pressure halves volume."},

{q:"Using PV=nRT, calculate the pressure of 1.0 mol of gas occupying 10.0 L at 273 K. (R=0.0821)",c:["1.12 atm","2.24 atm","3.36 atm","4.48 atm"],a:1,e:"P=(1×0.0821×273)/10 ≈ 2.24 atm."},

{q:"Which real-world application is best explained by Boyle's Law?",c:["Hot-air balloon expansion","Inflating a bicycle pump","Increasing tire pressure on a hot day","Adding air to a balloon"],a:1,e:"Compressing air in a bicycle pump decreases volume and increases pressure."},

{q:"Which gas law best explains why a hot-air balloon rises?",c:["Boyle's Law","Charles's Law","Gay-Lussac's Law","Avogadro's Law"],a:1,e:"Heating increases volume at constant pressure."},

{q:"Which gas law best explains increased tire pressure on a hot day?",c:["Boyle's Law","Charles's Law","Gay-Lussac's Law","Combined Gas Law"],a:2,e:"Higher temperatures increase pressure in a fixed volume."},

{q:"Which statement best summarizes Chapter 5?",c:["Gas behavior depends only on pressure","Gas laws describe how pressure, volume, temperature, and moles are related","All gases behave exactly the same under all conditions","Gas laws apply only at STP"],a:1,e:"The chapter focuses on understanding and predicting gas behavior through gas properties and gas laws."}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
